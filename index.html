<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fey DS — React + Tailwind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            fey: {
              0: "#000000", 1: "#0b0b0b", 2: "#131313", 3: "#1a1b20",
              ink: "#ffffff", high: "#e6e6e6", mid: "#868f97", low: "#787878",
              up: "#4ebe96", down: "#ef5350", link: "#479ffa", hot: "#ffa16c"
            }
          },
          fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
          letterSpacing: { hero: "-0.08em", title: "-0.32px", kicker: "0.16em" },
          boxShadow: { card: "0 1px 0 rgba(255,255,255,0.04), 0 24px 48px rgba(0,0,0,0.55)" }
        }
      }
    };
  </script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --background:#000000; --surface:#0b0b0b; --raised:#131313; --inset:#1a1b20;
      --text-primary:#ffffff; --text-high:#e6e6e6; --text-secondary:#868f97; --text-tertiary:#787878;
      --accent-green:#4ebe96; --accent-red:#ef5350; --accent-blue:#479ffa; --accent-orange:#ffa16c;
      --radius-card:16px; --radius-pill:99px; --pad-card:18px;
    }
    html,body{background:#000;color:#e6e6e6;margin:0;font-family:Inter,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    .tabular{font-variant-numeric:tabular-nums}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState } = React;
const cn = (...xs) => xs.filter(Boolean).join(" ");
function PillButton({ children, onClick }) {
  return <button onClick={onClick} className="inline-flex items-center rounded-[99px] bg-fey-high px-4 py-[7px] text-[13px] font-normal text-black hover:bg-white">{children}</button>;
}
function GhostIconButton({ label, children }) {
  return <button aria-label={label} className="inline-flex h-8 w-8 items-center justify-center rounded-full bg-fey-2 text-fey-high hover:bg-fey-3">{children}</button>;
}
function Kbd({ children }) {
  return <kbd className="inline-flex h-[22px] min-w-[22px] items-center justify-center rounded-[6px] bg-fey-3 px-1.5 text-[11px] font-semibold text-fey-mid">{children}</kbd>;
}
function TickerBadge({ children }) {
  return <span className="inline-flex items-center rounded-full bg-fey-2 px-2.5 py-1 text-[12px] font-semibold text-fey-ink">{children}</span>;
}
function Delta({ value }) {
  const up = value >= 0;
  return <span className={cn("tabular text-[13px] font-semibold", up ? "text-fey-up" : "text-fey-down")}>{up ? "+" : ""}{value.toFixed(2)}%</span>;
}
function SearchField({ value, onChange }) {
  return (
    <label className="flex h-10 w-full items-center gap-2 rounded-[99px] bg-fey-2 px-3.5">
      <input value={value} onChange={(e) => onChange(e.target.value)} placeholder="Search tickers, filings, news" className="w-full bg-transparent text-[14px] font-semibold text-fey-high outline-none placeholder:text-fey-low" />
    </label>
  );
}
function SegmentedControl({ options, value, onChange }) {
  return (
    <div className="inline-flex rounded-[99px] bg-fey-2 p-1">
      {options.map((opt) => (
        <button key={opt} onClick={() => onChange(opt)} className={cn("rounded-[99px] px-3 py-1 text-[12px] font-semibold uppercase tracking-kicker", value === opt ? "bg-fey-3 text-fey-ink" : "text-fey-mid")}>{opt}</button>
      ))}
    </div>
  );
}
function NavItem({ active, icon, label }) {
  return <button className={cn("flex w-full items-center gap-2.5 rounded-[12px] px-3 py-2 text-[14px] font-semibold", active ? "bg-fey-2 text-fey-ink" : "text-fey-mid")}>{icon} {label}</button>;
}
function SurfaceCard({ children }) {
  return <div className="rounded-[16px] bg-fey-1 p-[18px] shadow-card">{children}</div>;
}
function NewsCard({ source, time, title, body }) {
  return (
    <SurfaceCard>
      <div className="mb-2 text-[12px] font-semibold uppercase tracking-kicker"><span className="text-fey-hot">{source}</span><span className="text-fey-mid"> · {time}</span></div>
      <h3 className="text-[18px] font-bold leading-[1.4] tracking-title text-fey-ink">{title}</h3>
      <p className="mt-2 text-[14px] font-semibold leading-[1.5] text-fey-mid">{body}</p>
    </SurfaceCard>
  );
}
function InsiderRow({ name, role, action, shares, value }) {
  const buy = action === "Buy";
  return (
    <div className="flex items-center justify-between rounded-[12px] bg-fey-1 px-[18px] py-3">
      <div><div className="text-[14px] font-semibold text-fey-ink">{name}</div><div className="text-[12px] text-fey-mid">{role}</div></div>
      <div className="text-right"><div className={cn("text-[13px] font-semibold", buy ? "text-fey-up" : "text-fey-down")}>{action}</div><div className="tabular text-[12px] text-fey-mid">{shares} · {value}</div></div>
    </div>
  );
}
function Sparkline({ data, up = true, width = 72, height = 28 }) {
  const min = Math.min(...data), max = Math.max(...data);
  const pts = data.map((v, i) => `${(i / (data.length - 1)) * width},${height - ((v - min) / (max - min || 1)) * (height - 4) - 2}`).join(" ");
  return <svg width={width} height={height}><polyline fill="none" stroke={up ? "#4ebe96" : "#ef5350"} strokeWidth="1.6" strokeLinejoin="round" points={pts} /></svg>;
}
function WatchlistRow({ ticker, name, price, change, data }) {
  return (
    <div className="flex items-center gap-3 rounded-[12px] px-2 py-2.5 hover:bg-fey-1">
      <TickerBadge>{ticker}</TickerBadge>
      <div className="min-w-0 flex-1 truncate text-[14px] font-semibold text-fey-ink">{name}</div>
      <Sparkline data={data} up={change >= 0} />
      <div className="w-[72px] text-right"><div className="tabular text-[14px] font-semibold text-fey-ink">{price}</div><Delta value={change} /></div>
    </div>
  );
}
function TickerHero({ ticker, name, price, change }) {
  return (
    <SurfaceCard>
      <div className="flex items-center gap-2"><TickerBadge>{ticker}</TickerBadge><span className="text-[14px] font-semibold text-fey-mid">{name}</span></div>
      <div className="mt-4 flex items-end gap-3">
        <div className="tabular text-[54px] font-semibold leading-[1.1] tracking-hero text-fey-ink">{price}</div>
        <Delta value={change} />
      </div>
      <div className="mt-5"><Sparkline data={[210,214,212,218,221,219,226,229,227,232]} width={280} height={56} /></div>
    </SurfaceCard>
  );
}
function DataTable() {
  const rows = [["Revenue","394.3B","383.3B","+2.9%"],["Gross profit","180.7B","170.8B","+5.8%"],["Operating income","123.2B","114.3B","+7.8%"],["Net income","93.7B","97.0B","-3.4%"],["EPS","6.08","6.42","-5.3%"]];
  return (
    <div className="overflow-hidden rounded-[16px] bg-fey-1">
      <table className="w-full text-left">
        <thead><tr className="text-[12px] font-semibold uppercase tracking-kicker text-fey-low">
          <th className="px-[18px] py-3">Metric</th><th className="px-[18px] py-3">FY24</th><th className="px-[18px] py-3">FY23</th><th className="px-[18px] py-3">YoY</th>
        </tr></thead>
        <tbody>{rows.map((r) => (
          <tr key={r[0]} className="border-t border-white/[0.04]">
            <td className="px-[18px] py-3 text-[14px] font-semibold text-fey-ink">{r[0]}</td>
            <td className="tabular px-[18px] py-3 text-[14px] font-semibold text-fey-high">{r[1]}</td>
            <td className="tabular px-[18px] py-3 text-[14px] font-semibold text-fey-mid">{r[2]}</td>
            <td className={cn("tabular px-[18px] py-3 text-[14px] font-semibold", r[3].startsWith("-") ? "text-fey-down" : "text-fey-up")}>{r[3]}</td>
          </tr>
        ))}</tbody>
      </table>
    </div>
  );
}
function EarningsChip({ date, when }) {
  return <span className="inline-flex items-center gap-2 rounded-[99px] bg-fey-2 px-3 py-1.5 text-[12px] font-semibold"><span className="text-fey-ink">{date}</span><span className="text-fey-link">{when}</span></span>;
}
function CommandPalette({ open, onClose }) {
  const [q, setQ] = useState("");
  const items = [{k:"AAPL",t:"Apple Inc.",hint:"Equity"},{k:"MSFT",t:"Microsoft Corp.",hint:"Equity"},{k:"NVDA",t:"NVIDIA Corp.",hint:"Equity"},{k:"Filings",t:"Latest 10-K / 10-Q",hint:"Docs"}].filter((x) => (x.k+x.t).toLowerCase().includes(q.toLowerCase()));
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center bg-black/70 pt-[12vh]" onClick={onClose}>
      <div className="w-[min(560px,92vw)] overflow-hidden rounded-[16px] bg-fey-1 shadow-card" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center gap-2 border-b border-white/[0.04] px-[18px] py-3">
          <input autoFocus value={q} onChange={(e) => setQ(e.target.value)} placeholder="Jump to ticker, filing, or command" className="w-full bg-transparent text-[16px] font-medium text-fey-ink outline-none" />
          <Kbd>esc</Kbd>
        </div>
        <div className="p-2">{items.map((it, i) => (
          <div key={it.k} className={cn("flex items-center justify-between rounded-[12px] px-3 py-2.5", i===0 && "bg-fey-2")}>
            <div><div className="text-[14px] font-semibold text-fey-ink">{it.k}</div><div className="text-[12px] text-fey-mid">{it.t}</div></div>
            <span className="text-[11px] font-semibold uppercase tracking-kicker text-fey-low">{it.hint}</span>
          </div>
        ))}</div>
      </div>
    </div>
  );
}
function CopyBtn({ text }) {
  const [ok, setOk] = useState(false);
  return <button onClick={async () => { await navigator.clipboard.writeText(text); setOk(true); setTimeout(() => setOk(false), 1200); }} className="rounded-[99px] bg-fey-3 px-2.5 py-1 text-[11px] font-semibold text-fey-high">{ok ? "Copied" : "Copy"}</button>;
}
function Block({ id, name, note, preview, code }) {
  return (
    <section id={id} className="scroll-mt-8 border-t border-white/[0.06] py-10">
      <div className="mb-4"><h2 className="text-[18px] font-bold leading-[1.4] tracking-title text-fey-ink">{name}</h2><p className="mt-1 text-[13px] text-fey-mid">{note}</p></div>
      <div className="rounded-[16px] bg-fey-1 p-[18px] shadow-card">{preview}</div>
      <div className="mt-3 overflow-hidden rounded-[16px] bg-[#070707]">
        <div className="flex items-center justify-between px-4 py-2"><span className="text-[11px] font-semibold uppercase tracking-kicker text-fey-low">JSX</span><CopyBtn text={code} /></div>
        <pre className="overflow-x-auto px-4 pb-4 text-[12px] text-fey-high"><code>{code}</code></pre>
      </div>
    </section>
  );
}
const S = {
  Tokens: `:root { --background:#000; --surface:#0b0b0b; --raised:#131313; --pad-card:18px; --radius-card:16px; --radius-pill:99px; }`,
  Type: `<h1 className="text-[54px] font-semibold leading-[1.1] tracking-[-0.08em]">$229.87</h1>`,
  PillButton: `<button className="rounded-[99px] bg-[#e6e6e6] px-4 py-[7px] text-[13px] font-normal text-black">Get started</button>`,
  GhostIconButton: `<button className="h-8 w-8 rounded-full bg-[#131313]">+</button>`,
  Kbd: `<kbd className="rounded-[6px] bg-[#1a1b20] px-1.5 text-[11px] text-[#868f97]">⌘K</kbd>`,
  TickerBadge: `<span className="rounded-full bg-[#131313] px-2.5 py-1 text-[12px] font-semibold">AAPL</span>`,
  Delta: `<span className="tabular-nums text-[13px] font-semibold text-[#4ebe96]">+1.24%</span>`,
  SearchField: `<input className="h-10 w-full rounded-[99px] bg-[#131313] px-3.5 text-[14px] font-semibold outline-none" />`,
  SegmentedControl: `<div className="inline-flex rounded-[99px] bg-[#131313] p-1">1D 1W 1M 1Y 5Y</div>`,
  NavItem: `<button className="rounded-[12px] bg-[#131313] px-3 py-2 text-[14px] font-semibold">Markets</button>`,
  SurfaceCard: `<div className="rounded-[16px] bg-[#0b0b0b] p-[18px]">Card</div>`,
  NewsCard: `<article className="rounded-[16px] bg-[#0b0b0b] p-[18px]"><div className="text-[#ffa16c]">Bloomberg · 2h</div><h3 className="text-[18px] font-bold">Headline</h3></article>`,
  InsiderRow: `<div className="flex justify-between rounded-[12px] bg-[#0b0b0b] px-[18px] py-3">T. Cook · Buy</div>`,
  Sparkline: `<svg width="72" height="28"><polyline fill="none" stroke="#4ebe96" strokeWidth="1.6" points="0,20 72,8" /></svg>`,
  WatchlistRow: `<div className="flex gap-3"><TickerBadge>NVDA</TickerBadge><Delta value={2.41} /></div>`,
  TickerHero: `<div className="text-[54px] font-semibold tracking-[-0.08em]">$229.87</div>`,
  DataTable: `<table className="w-full text-[14px] font-semibold"><thead className="text-[12px] uppercase tracking-[0.16em] text-[#787878]"><tr><th className="px-[18px]">Metric</th></tr></thead></table>`,
  EarningsChip: `<span className="rounded-[99px] bg-[#131313] px-3 py-1.5 text-[12px] font-semibold">Oct 31 <span className="text-[#479ffa]">AMC</span></span>`,
  CommandPalette: `<div className="rounded-[16px] bg-[#0b0b0b] p-[18px]"><input className="w-full bg-transparent outline-none" placeholder="Jump to ticker…" /></div>`
};
const TOKENS = [["#000000","background"],["#0b0b0b","surface"],["#131313","raised"],["#1a1b20","inset"],["#ffffff","ink"],["#e6e6e6","high"],["#868f97","mid"],["#787878","low"],["#4ebe96","gain"],["#ef5350","loss"],["#479ffa","link"],["#ffa16c","highlight"]];
function App() {
  const [q, setQ] = useState("");
  const [range, setRange] = useState("1Y");
  const [cmd, setCmd] = useState(false);
  const nav = [["tokens","Tokens"],["type","Type"],["pill","PillButton"],["ghost","GhostIcon"],["kbd","Kbd"],["badge","TickerBadge"],["delta","Delta"],["search","SearchField"],["seg","Segmented"],["nav","NavItem"],["card","SurfaceCard"],["news","NewsCard"],["insider","InsiderRow"],["spark","Sparkline"],["watch","WatchlistRow"],["hero","TickerHero"],["table","DataTable"],["earn","EarningsChip"],["cmd","CommandPalette"]];
  React.useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); setCmd(true); }
      if (e.key === "Escape") setCmd(false);
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);
  return (
    <div className="min-h-screen bg-fey-0 text-fey-high">
      <CommandPalette open={cmd} onClose={() => setCmd(false)} />
      <div className="mx-auto grid max-w-[1180px] grid-cols-1 gap-8 px-5 py-8 lg:grid-cols-[220px_1fr]">
        <aside className="lg:sticky lg:top-8 lg:self-start">
          <div className="mb-6">
            <div className="text-[12px] font-semibold uppercase tracking-kicker text-fey-low">Fey-inspired</div>
            <h1 className="mt-1 text-[26px] font-semibold leading-[1.3] text-fey-ink">Design system</h1>
            <p className="mt-2 text-[13px] text-fey-mid">React + Tailwind. Refero tokens. No glass.</p>
          </div>
          <nav className="space-y-0.5">{nav.map(([id,label]) => <a key={id} href={"#"+id} className="block rounded-[10px] px-2.5 py-1.5 text-[13px] font-semibold text-fey-mid hover:bg-fey-1 hover:text-fey-ink">{label}</a>)}</nav>
          <button onClick={() => setCmd(true)} className="mt-6 flex w-full items-center justify-between rounded-[99px] bg-fey-2 px-3 py-2 text-[12px] font-semibold text-fey-mid">Open palette <span className="flex gap-1"><Kbd>⌘</Kbd><Kbd>K</Kbd></span></button>
        </aside>
        <main>
          <Block id="tokens" name="Tokens" note="Refero colors. No aurora yellow, no glass, no 275px radius." preview={<div className="grid grid-cols-2 gap-2 sm:grid-cols-4">{TOKENS.map(([hex,label]) => <div key={hex} className="overflow-hidden rounded-[12px] bg-fey-0"><div className="h-14" style={{background:hex}} /><div className="px-2.5 py-2"><div className="text-[12px] font-semibold text-fey-ink">{label}</div><div className="tabular text-[11px] text-fey-mid">{hex}</div></div></div>)}</div>} code={S.Tokens} />
          <Block id="type" name="Type" note="54/-0.08em/1.1 · 26/1.3 · 18/700/-0.32px · 14/600/1.5 · 12/600/0.16em." preview={<div className="space-y-3"><div className="text-[54px] font-semibold leading-[1.1] tracking-hero text-fey-ink">$229.87</div><div className="text-[26px] font-semibold leading-[1.3] text-fey-ink">Markets</div><div className="text-[18px] font-bold leading-[1.4] tracking-title text-fey-ink">Apple raises services guidance</div><div className="text-[14px] font-semibold leading-[1.5] text-fey-high">Body 14 / 600</div><div className="text-[12px] font-semibold uppercase tracking-kicker text-fey-low">Label</div></div>} code={S.Type} />
          <Block id="pill" name="PillButton" note="13/400 · 7×16 · radius 99." preview={<div className="flex gap-3"><PillButton>Get started</PillButton><PillButton>Start trial</PillButton></div>} code={S.PillButton} />
          <Block id="ghost" name="GhostIconButton" note="32px circle." preview={<div className="flex gap-2"><GhostIconButton label="Add">+</GhostIconButton><GhostIconButton label="More">···</GhostIconButton></div>} code={S.GhostIconButton} />
          <Block id="kbd" name="Kbd" note="Keyboard chrome." preview={<div className="flex gap-1.5"><Kbd>⌘</Kbd><Kbd>K</Kbd></div>} code={S.Kbd} />
          <Block id="badge" name="TickerBadge" note="Raised symbol pill." preview={<div className="flex gap-2"><TickerBadge>AAPL</TickerBadge><TickerBadge>NVDA</TickerBadge></div>} code={S.TickerBadge} />
          <Block id="delta" name="Delta" note="Green/red only here." preview={<div className="flex gap-4"><Delta value={1.24} /><Delta value={-0.86} /></div>} code={S.Delta} />
          <Block id="search" name="SearchField" note="Radius 99." preview={<SearchField value={q} onChange={setQ} />} code={S.SearchField} />
          <Block id="seg" name="SegmentedControl" note="12px uppercase 0.16em." preview={<SegmentedControl options={["1D","1W","1M","1Y","5Y"]} value={range} onChange={setRange} />} code={S.SegmentedControl} />
          <Block id="nav" name="NavItem" note="Nested radius 12." preview={<div className="max-w-xs space-y-1"><NavItem active icon="◎" label="Markets" /><NavItem icon="▣" label="Watchlist" /></div>} code={S.NavItem} />
          <Block id="card" name="SurfaceCard" note="Radius 16, padding 18." preview={<SurfaceCard><div className="text-[14px] font-semibold text-fey-ink">Research surface</div></SurfaceCard>} code={S.SurfaceCard} />
          <Block id="news" name="NewsCard" note="Source #ffa16c. Title 18/700." preview={<NewsCard source="Bloomberg" time="2h" title="Apple raises services guidance after record quarter" body="Installed base and mix shift lift high-margin revenue." />} code={S.NewsCard} />
          <Block id="insider" name="InsiderRow" note="P&L color on action." preview={<div className="space-y-2"><InsiderRow name="T. Cook" role="CEO" action="Buy" shares="25,000" value="$5.7M" /><InsiderRow name="L. Maestri" role="CFO" action="Sell" shares="10,400" value="$2.4M" /></div>} code={S.InsiderRow} />
          <Block id="spark" name="Sparkline" note="Up/down stroke only." preview={<div className="flex gap-8"><Sparkline data={[12,14,13,16,18,17,21,20,24]} up /><Sparkline data={[24,22,23,19,18,16,14,12]} up={false} /></div>} code={S.Sparkline} />
          <Block id="watch" name="WatchlistRow" note="Ticker, spark, price, delta." preview={<div><WatchlistRow ticker="AAPL" name="Apple" price="$229.87" change={1.24} data={[210,214,218,221,226,229]} /><WatchlistRow ticker="MSFT" name="Microsoft" price="$428.10" change={-0.42} data={[440,436,432,430,429,428]} /><WatchlistRow ticker="NVDA" name="NVIDIA" price="$172.64" change={2.41} data={[150,154,160,164,168,172]} /></div>} code={S.WatchlistRow} />
          <Block id="hero" name="TickerHero" note="54/600 / -0.08em / 1.1." preview={<TickerHero ticker="AAPL" name="Apple Inc." price="$229.87" change={1.24} />} code={S.TickerHero} />
          <Block id="table" name="DataTable" note="Header 12/600 / 0.16em. Pad 18." preview={<DataTable />} code={S.DataTable} />
          <Block id="earn" name="EarningsChip" note="Session #479ffa." preview={<div className="flex gap-2"><EarningsChip date="Oct 31" when="AMC" /><EarningsChip date="Nov 7" when="BMO" /></div>} code={S.EarningsChip} />
          <Block id="cmd" name="CommandPalette" note="⌘K." preview={<PillButton onClick={() => setCmd(true)}>Open ⌘K</PillButton>} code={S.CommandPalette} />
          <p className="border-t border-white/[0.06] py-8 text-[12px] text-fey-low">Not affiliated with Fey or Wealthsimple. Inter replaces Calibre.</p>
        </main>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
