<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fey DS — Markets</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/feather-icons"></script>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>html,body{margin:0;background:#000;color:#e6e6e6;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif;-webkit-font-smoothing:antialiased}.tabular{font-variant-numeric:tabular-nums}.feather{width:15px;height:15px;stroke-width:1.8}</style>
</head>
<body><div id="root"></div>
<script type="text/babel" data-presets="react">
const {useEffect,useState}=React;const cn=(...v)=>v.filter(Boolean).join(' ');
function Icon({name,size=15}){return <i data-feather={name} className="feather" style={{width:size,height:size}}/>}
function Button({children,onClick}){return <button onClick={onClick} className="inline-flex items-center gap-2 rounded-full bg-[#e6e6e6] px-4 py-2 text-[13px] font-normal text-black hover:bg-white">{children}</button>}
function IconButton({label,icon,onClick}){return <button aria-label={label} title={label} onClick={onClick} className="inline-flex h-8 w-8 items-center justify-center rounded-full bg-[#131313] text-[#e6e6e6] hover:bg-[#1a1b20]"><Icon name={icon}/></button>}
function Badge({children}){return <span className="rounded-full bg-[#131313] px-2.5 py-1 text-[12px] font-semibold text-white">{children}</span>}
function Delta({value}){return <span className={cn('tabular text-[13px] font-semibold',value>=0?'text-[#4ebe96]':'text-[#ef5350]')}>{value>=0?'+':''}{value.toFixed(2)}%</span>}
function Card({children}){return <div className="rounded-2xl bg-[#0b0b0b] p-[18px]">{children}</div>}
function Alert({title,body,tone='link'}){const c=tone==='up'?'#4ebe96':tone==='down'?'#ef5350':'#479ffa';return <div className="rounded-xl bg-[#131313] px-[18px] py-3"><div className="flex items-center gap-2 text-[13px] font-semibold" style={{color:c}}><Icon name={tone==='up'?'trending-up':tone==='down'?'trending-down':'file-text'} size={14}/>{title}</div><div className="mt-1 text-[13px] text-[#868f97]">{body}</div></div>}
function Spark({down=false,width=72}){return <svg width={width} height="28"><polyline fill="none" stroke={down?'#ef5350':'#4ebe96'} strokeWidth="1.6" points={down?'0,8 12,10 24,8 36,15 48,17 60,23 72,25':'0,24 12,20 24,22 36,14 48,16 60,8 72,10'}/></svg>}
function Table(){return <div className="overflow-hidden rounded-2xl bg-black"><table className="w-full text-left"><thead className="text-[12px] font-semibold uppercase tracking-[.16em] text-[#787878]"><tr><th className="px-[18px] py-3">Metric</th><th className="px-[18px] py-3">FY24</th><th className="px-[18px] py-3">YoY</th></tr></thead><tbody>{[['Revenue','394.3B','+2.9%'],['Gross profit','180.7B','+5.8%'],['Net income','93.7B','-3.4%']].map(r=><tr key={r[0]} className="border-t border-white/10"><td className="px-[18px] py-3 text-[14px] font-semibold text-white">{r[0]}</td><td className="tabular px-[18px] py-3 text-[14px] font-semibold">{r[1]}</td><td className={cn('tabular px-[18px] py-3 text-[14px] font-semibold',r[2][0]==='-'?'text-[#ef5350]':'text-[#4ebe96]')}>{r[2]}</td></tr>)}</tbody></table></div>}
function MenuRow({icon,label,hint,onClick}){return <button onClick={onClick} className="flex w-full items-center justify-between rounded-xl px-3 py-2.5 text-left hover:bg-[#131313]"><span className="flex items-center gap-2.5 text-[14px] font-semibold text-white"><Icon name={icon} size={14}/>{label}</span><span className="text-[12px] text-[#787878]">{hint}</span></button>}
function NavItem({active,icon,label,onClick}){return <button onClick={onClick} className={cn('flex w-full items-center gap-2.5 rounded-xl px-3 py-2 text-left text-[14px] font-semibold',active?'bg-[#131313] text-white':'text-[#868f97] hover:text-white')}><Icon name={icon}/>{label}</button>}
function WatchRow({ticker,name,price,change,onClick}){return <button onClick={onClick} className="flex w-full items-center gap-3 rounded-xl px-2 py-2.5 text-left hover:bg-[#131313]"><Badge>{ticker}</Badge><span className="min-w-0 flex-1 truncate text-[14px] font-semibold text-white">{name}</span><Spark down={change<0}/><span className="w-[72px] text-right"><span className="block tabular text-[14px] font-semibold text-white">{price}</span><Delta value={change}/></span></button>}
function Command({open,onClose,onPick}){const [q,setQ]=useState('');if(!open)return null;const rows=[['AAPL','Apple Inc.'],['MSFT','Microsoft Corp.'],['NVDA','NVIDIA Corp.']].filter(x=>(x[0]+x[1]).toLowerCase().includes(q.toLowerCase()));return <div className="fixed inset-0 z-50 flex justify-center bg-black/70 pt-[12vh]" onClick={onClose}><div className="w-[min(560px,92vw)] rounded-2xl bg-[#0b0b0b] shadow-[0_0_44px_rgba(0,0,0,.8)]" onClick={e=>e.stopPropagation()}><div className="flex items-center gap-2 border-b border-white/10 p-4"><Icon name="search"/><input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder="Jump to ticker" className="w-full bg-transparent text-white outline-none"/><span className="text-xs text-[#787878]">esc</span></div><div className="p-2">{rows.map((r,i)=><button key={r[0]} onClick={()=>{onPick(r[0]);onClose()}} className={cn('flex w-full justify-between rounded-xl px-3 py-2.5 text-left',i===0&&'bg-[#131313]')}><span><span className="block text-[14px] font-semibold text-white">{r[0]}</span><span className="block text-[12px] text-[#868f97]">{r[1]}</span></span><span className="text-[11px] uppercase text-[#787878]">Equity</span></button>)}</div></div></div>}
function App(){const [nav,setNav]=useState('Markets'),[alias,setAlias]=useState('AAPL'),[cmd,setCmd]=useState(false),[modal,setModal]=useState(false),[tab,setTab]=useState('Overview'),[range,setRange]=useState('1Y'),[toast,setToast]=useState(true),[q,setQ]=useState('');useEffect(()=>{const key=e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();setCmd(true)}if(e.key==='Escape'){setCmd(false);setModal(false)}};addEventListener('keydown',key);return()=>removeEventListener('keydown',key)},[]);useEffect(()=>{if(window.feather)window.feather.replace()},[nav,tab,cmd,modal,toast]);const watch=[['AAPL','Apple','$229.87',1.24],['MSFT','Microsoft','$428.10',-.42],['NVDA','NVIDIA','$172.64',2.41]];return <div className="min-h-screen bg-black text-[#e6e6e6]"><Command open={cmd} onClose={()=>setCmd(false)} onPick={setAlias}/>{toast&&<div className="fixed bottom-5 right-5 z-30 rounded-xl bg-[#131313] px-3.5 py-2 text-[13px] font-semibold text-white shadow-[0_0_44px_rgba(0,0,0,.8)]"><Icon name="check-circle" size={14}/><span className="ml-2">Copied {alias}</span><button className="ml-3 text-[#787878]" onClick={()=>setToast(false)}>x</button></div>}<div className="mx-auto grid max-w-[1280px] grid-cols-1 lg:grid-cols-[240px_1fr_300px]"><aside className="border-b border-white/10 p-4 lg:border-b-0 lg:border-r"><div className="mb-6 flex items-center justify-between"><div><div className="text-[12px] font-semibold uppercase tracking-[.16em] text-[#787878]">Fey-inspired</div><div className="text-[18px] font-bold text-white">Markets</div></div><span className="h-1.5 w-1.5 rounded-full bg-[#4ebe96]"/></div>{[['Markets','activity'],['Watchlist','star'],['Filings','file-text'],['News','rss'],['Settings','settings']].map(x=><NavItem key={x[0]} active={nav===x[0]} icon={x[1]} label={x[0]} onClick={()=>setNav(x[0])}/>)}<div className="my-4 h-px bg-white/10"/><MenuRow icon="download" label="Export CSV" hint="Shift+Cmd+E" onClick={()=>setModal(true)}/><MenuRow icon="link" label="Copy link" hint="Cmd+C" onClick={()=>setToast(true)}/><MenuRow icon="command" label="Command" hint="Cmd+K" onClick={()=>setCmd(true)}/><a href="design-system/" className="flex items-center justify-between rounded-xl px-3 py-2.5 text-[14px] font-semibold text-[#479ffa] hover:bg-[#131313]"><span className="flex items-center gap-2.5"><Icon name="layers"/>Design system</span><Icon name="arrow-right"/></a><div className="mt-6 flex items-center gap-3"><span className="inline-flex h-9 w-9 items-center justify-center rounded-full bg-[#131313] text-xs font-semibold">AS</span><span><span className="block text-[14px] font-semibold text-white">Amit</span><span className="block text-[12px] text-[#868f97]">Workspace</span></span></div></aside><main className="min-w-0 p-5"><header className="sticky top-0 z-20 -mx-5 mb-5 bg-black px-5 py-3 shadow-[0_0_35px_rgba(0,0,0,.5)]"><div className="flex flex-wrap items-center gap-3"><div className="flex items-center gap-2 text-[13px] font-semibold"><span className="text-[#868f97]">Markets</span><Icon name="chevron-right" size={12}/><span className="text-[#868f97]">US</span><Icon name="chevron-right" size={12}/><span className="text-white">{alias}</span></div><div className="ml-auto flex gap-2"><label className="flex h-10 w-[min(320px,100%)] items-center gap-2 rounded-full bg-[#131313] px-3.5"><Icon name="search"/><input value={q} onFocus={()=>setCmd(true)} onChange={e=>setQ(e.target.value)} placeholder="Search tickers, filings, news" className="w-full bg-transparent text-sm font-semibold text-white outline-none placeholder:text-[#787878]"/></label><IconButton label="Add ticker" icon="plus"/><IconButton label="More" icon="more-horizontal" onClick={()=>setModal(true)}/></div></div></header><Card><div className="flex flex-wrap items-start justify-between gap-4"><div><div className="flex items-center gap-2"><Badge>{alias}</Badge><span className="text-sm font-semibold text-[#868f97]">{alias==='AAPL'?'Apple Inc.':alias}</span><span className="rounded-full bg-[#1a1b20] px-2.5 py-1 text-xs font-semibold text-white">Equity</span></div><div className="mt-4 flex items-end gap-3"><div className="tabular text-[54px] font-semibold leading-[1.1] tracking-[-.08em] text-white">$229.87</div><Delta value={1.24}/></div><div className="mt-5"><Spark width={520}/></div></div><div className="flex flex-col items-end gap-2"><div className="inline-flex rounded-full bg-[#131313] p-1">{['1D','1W','1M','1Y','5Y'].map(r=><button key={r} onClick={()=>setRange(r)} className={cn('rounded-full px-3 py-1 text-xs font-semibold',range===r?'bg-[#1a1b20] text-white':'text-[#868f97]')}>{r}</button>)}</div><span className="inline-flex items-center gap-2 rounded-full bg-[#131313] px-3 py-1.5 text-xs font-semibold"><Icon name="calendar" size={13}/>Oct 31 <span className="text-[#479ffa]">AMC</span></span><Button onClick={()=>setModal(true)}><Icon name="download" size={14}/>Export</Button></div></div><div className="mt-5 grid grid-cols-2 gap-2 sm:grid-cols-4">{[['Mkt cap','3.48T',1.1],['P/E','35.2',-.4],['Rev TTM','394B',2.9],['Margin','46.2%',.6]].map(x=><div key={x[0]} className="rounded-xl bg-black px-3.5 py-3"><div className="text-xs uppercase tracking-[.16em] text-[#787878]">{x[0]}</div><div className="mt-1 text-lg font-bold text-white">{x[1]}</div><Delta value={x[2]}/></div>)}</div></Card><div className="mt-5"><div className="flex gap-5 border-b border-white/10">{['Overview','Financials','Holders'].map(t=><button key={t} onClick={()=>setTab(t)} className={cn('pb-2 text-sm font-semibold',tab===t?'text-white':'text-[#868f97]')}>{t}</button>)}</div></div>{tab==='Financials'?<div className="mt-5"><Table/></div>:tab==='Holders'?<div className="mt-5"><Card><div className="text-lg font-bold text-white">No holdings yet</div><p className="mt-2 text-sm text-[#868f97]">Add a position to see holder data.</p><Button onClick={()=>setTab('Overview')}>Back to overview</Button></Card></div>:<div className="mt-5 grid gap-4 lg:grid-cols-2"><Alert tone="up" title="Beat" body="EPS above consensus. Services mix helped."/><Alert tone="link" title="Filing" body="10-Q posted this morning."/><Card><div className="mb-2 flex items-center gap-2 text-xs font-semibold uppercase tracking-[.16em]"><Icon name="rss" size={12}/><span className="text-[#ffa16c]">Bloomberg</span><span className="text-[#868f97]">· 2h</span></div><h3 className="text-lg font-bold text-white">Apple raises services guidance after record quarter</h3><p className="mt-2 text-sm font-semibold text-[#868f97]">Installed base and mix shift lift high-margin revenue.</p></Card><Card><div className="mb-3 text-xs font-semibold uppercase tracking-[.16em] text-[#787878]">Insiders</div><div className="space-y-2"><div className="flex items-center justify-between rounded-xl bg-black px-[18px] py-3"><span className="text-sm font-semibold text-white">T. Cook <span className="text-xs text-[#868f97]">CEO</span></span><span className="text-[#4ebe96]">Buy</span></div><div className="flex items-center justify-between rounded-xl bg-black px-[18px] py-3"><span className="text-sm font-semibold text-white">L. Maestri <span className="text-xs text-[#868f97]">CFO</span></span><span className="text-[#ef5350]">Sell</span></div></div></Card></div>}</main><aside className="border-t border-white/10 p-4 lg:border-l lg:border-t-0"><div className="mb-3 flex items-center justify-between"><div className="text-xs font-semibold uppercase tracking-[.16em] text-[#787878]">Watchlist</div><IconButton label="Add ticker" icon="plus" onClick={()=>setCmd(true)}/></div>{watch.map(w=><WatchRow key={w[0]} ticker={w[0]} name={w[1]} price={w[2]} change={w[3]} onClick={()=>{setAlias(w[0]);setNav('Markets')}}/>)}<div className="my-4 h-px bg-white/10"/><div className="text-xs font-semibold uppercase tracking-[.16em] text-[#787878]">Coverage</div><div className="mt-2 flex gap-2"><Badge>US</Badge><Badge>EU</Badge><Badge>Asia</Badge></div><div className="mt-4"><Alert tone="down" title="Miss risk" body="iPhone units still the swing factor."/></div></aside></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>addEventListener('load',()=>{if(window.feather)window.feather.replace()})</script>
</body></html>
