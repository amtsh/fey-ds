<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Fey DS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{fey:{0:'#000000',1:'#0b0b0b',2:'#131313',3:'#1a1b20',ink:'#ffffff',high:'#e6e6e6',mid:'#868f97',low:'#787878',up:'#4ebe96',down:'#ef5350',link:'#479ffa',hot:'#ffa16c'}},fontFamily:{sans:['Inter','sans-serif']},letterSpacing:{hero:'-0.08em',title:'-0.32px',kicker:'0.16em'}}}}</script>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>html,body{background:#000;color:#e6e6e6;margin:0;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}.tabular{font-variant-numeric:tabular-nums}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState}=React;
const cn=(...xs)=>xs.filter(Boolean).join(' ');
function PillButton({children,onClick}){return <button onClick={onClick} className="inline-flex items-center rounded-[99px] bg-fey-high px-4 py-[7px] text-[13px] font-normal text-black hover:bg-white">{children}</button>}
function GhostIconButton({label,children,onClick}){return <button aria-label={label} onClick={onClick} className="inline-flex h-8 w-8 items-center justify-center rounded-full bg-fey-2 text-fey-high hover:bg-fey-3">{children}</button>}
function Kbd({children}){return <kbd className="inline-flex h-[22px] min-w-[22px] items-center justify-center rounded-[6px] bg-fey-3 px-1.5 text-[11px] font-semibold text-fey-mid">{children}</kbd>}
function TickerBadge({children}){return <span className="inline-flex rounded-full bg-fey-2 px-2.5 py-1 text-[12px] font-semibold text-fey-ink">{children}</span>}
function Delta({value}){const up=value>=0;return <span className={cn('tabular text-[13px] font-semibold',up?'text-fey-up':'text-fey-down')}>{up?'+':''}{value.toFixed(2)}%</span>}
function TextInput({label,value,onChange,placeholder}){return <label className="block w-full"><span className="mb-1.5 block text-[12px] font-semibold uppercase tracking-kicker text-fey-low">{label}</span><input value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} className="h-10 w-full rounded-[12px] bg-fey-2 px-3.5 text-[14px] font-semibold text-fey-ink outline-none placeholder:text-fey-low"/></label>}
function TextArea({label,value,onChange}){return <label className="block w-full"><span className="mb-1.5 block text-[12px] font-semibold uppercase tracking-kicker text-fey-low">{label}</span><textarea value={value} onChange={e=>onChange(e.target.value)} rows={3} className="w-full resize-none rounded-[12px] bg-fey-2 px-3.5 py-2.5 text-[14px] font-semibold text-fey-ink outline-none"/></label>}
function Checkbox({label,checked,onChange}){return <button type="button" onClick={()=>onChange(!checked)} className="flex items-center gap-2.5 text-[14px] font-semibold text-fey-ink"><span className={cn('flex h-4 w-4 items-center justify-center rounded-[4px]',checked?'bg-fey-high text-black':'bg-fey-3')}>{checked?'\u2713':''}</span>{label}</button>}
function Toggle({on,onChange}){return <button type="button" onClick={()=>onChange(!on)} className={cn('relative h-6 w-10 rounded-full',on?'bg-fey-high':'bg-fey-3')}><span className={cn('absolute top-0.5 h-5 w-5 rounded-full bg-black transition',on?'left-4':'left-0.5')}/></button>}
function Radio({options,value,onChange}){return <div className="space-y-2">{options.map(opt=><button key={opt} type="button" onClick={()=>onChange(opt)} className="flex items-center gap-2.5 text-[14px] font-semibold text-fey-ink"><span className={cn('flex h-4 w-4 items-center justify-center rounded-full bg-fey-3',value===opt&&'ring-1 ring-fey-high')}>{value===opt&&<span className="h-2 w-2 rounded-full bg-fey-high"/>}</span>{opt}</button>)}</div>}
function Select({value,options,onChange}){return <select value={value} onChange={e=>onChange(e.target.value)} className="h-10 rounded-[12px] bg-fey-2 px-3.5 text-[14px] font-semibold text-fey-ink outline-none">{options.map(o=><option key={o}>{o}</option>)}</select>}
function LinkText({children}){return <a href="#" className="text-[14px] font-semibold text-fey-link hover:underline">{children}</a>}
function Divider(){return <div className="h-px w-full bg-white/[0.06]"/>}
function Avatar({initials,size=32}){return <span className="inline-flex items-center justify-center rounded-full bg-fey-2 text-[12px] font-semibold text-fey-ink" style={{width:size,height:size}}>{initials}</span>}
function Chip({children,on}){return <span className={cn('inline-flex rounded-[99px] px-2.5 py-1 text-[12px] font-semibold',on?'bg-fey-3 text-fey-ink':'bg-fey-2 text-fey-mid')}>{children}</span>}
function Alert({tone,title,body}){const color=tone==='up'?'text-fey-up':tone==='down'?'text-fey-down':'text-fey-link';return <div className="rounded-[12px] bg-fey-2 px-[18px] py-3"><div className={cn('text-[13px] font-semibold',color)}>{title}</div><div className="mt-1 text-[13px] text-fey-mid">{body}</div></div>}
function Spinner(){return <span className="inline-block h-4 w-4 animate-spin rounded-full border-2 border-fey-3 border-t-fey-high"/>}
function Progress({value}){return <div className="h-1.5 w-full overflow-hidden rounded-full bg-fey-3"><div className="h-full rounded-full bg-fey-high" style={{width:value+'%'}}/></div>}
function Skeleton(){return <div className="space-y-2"><div className="h-4 w-2/3 animate-pulse rounded bg-fey-2"/><div className="h-4 w-full animate-pulse rounded bg-fey-2"/><div className="h-4 w-5/6 animate-pulse rounded bg-fey-2"/></div>}
function Tabs({tabs,value,onChange}){return <div className="flex gap-5 border-b border-white/[0.06]">{tabs.map(t=><button key={t} onClick={()=>onChange(t)} className={cn('pb-2 text-[14px] font-semibold',value===t?'text-fey-ink':'text-fey-mid')}>{t}</button>)}</div>}
function Toast({children}){return <div className="inline-flex rounded-[12px] bg-fey-2 px-3.5 py-2 text-[13px] font-semibold text-fey-ink">{children}</div>}
function EmptyState(){return <div className="rounded-[16px] bg-fey-1 px-6 py-10 text-center"><div className="text-[18px] font-bold text-fey-ink">No holdings yet</div><p className="mt-2 text-[14px] font-semibold text-fey-mid">Add a ticker to start a watchlist.</p><div className="mt-4"><PillButton>Add ticker</PillButton></div></div>}
function Pagination({page,pages,onChange}){return <div className="flex items-center gap-2"><GhostIconButton label="Prev" onClick={()=>onChange(Math.max(1,page-1))}>{'\u2039'}</GhostIconButton><span className="tabular text-[13px] font-semibold text-fey-mid">{page} / {pages}</span><GhostIconButton label="Next" onClick={()=>onChange(Math.min(pages,page+1))}>{'\u203A'}</GhostIconButton></div>}
function Breadcrumb(){return <div className="flex items-center gap-2 text-[13px] font-semibold"><span className="text-fey-mid">Markets</span><span className="text-fey-low">/</span><span className="text-fey-mid">US</span><span className="text-fey-low">/</span><span className="text-fey-ink">AAPL</span></div>}
function Slider({value,onChange}){return <input type="range" min="0" max="100" value={value} onChange={e=>onChange(Number(e.target.value))} className="w-full accent-[#e6e6e6]"/>}
function MenuRow({label,hint}){return <button className="flex w-full items-center justify-between rounded-[12px] px-3 py-2.5 text-left hover:bg-fey-2"><span className="text-[14px] font-semibold text-fey-ink">{label}</span><span className="text-[12px] font-semibold text-fey-low">{hint}</span></button>}
function Modal({open,onClose}){if(!open)return null;return <div className="fixed inset-0 z-40 flex items-center justify-center bg-black/70" onClick={onClose}><div className="w-[min(400px,92vw)] rounded-[16px] bg-fey-1 p-[18px]" onClick={e=>e.stopPropagation()}><div className="text-[18px] font-bold text-fey-ink">Export sheet</div><p className="mt-2 text-[14px] font-semibold text-fey-mid">Download financials as CSV.</p><div className="mt-4 flex justify-end gap-2"><button onClick={onClose} className="rounded-[99px] px-3 py-1.5 text-[13px] font-semibold text-fey-mid">Cancel</button><PillButton onClick={onClose}>Export</PillButton></div></div></div>}
function SearchField({value,onChange}){return <label className="flex h-10 w-full items-center rounded-[99px] bg-fey-2 px-3.5"><input value={value} onChange={e=>onChange(e.target.value)} placeholder="Search tickers, filings, news" className="w-full bg-transparent text-[14px] font-semibold text-fey-high outline-none placeholder:text-fey-low"/></label>}
function SegmentedControl({options,value,onChange}){return <div className="inline-flex rounded-[99px] bg-fey-2 p-1">{options.map(opt=><button key={opt} onClick={()=>onChange(opt)} className={cn('rounded-[99px] px-3 py-1 text-[12px] font-semibold uppercase tracking-kicker',value===opt?'bg-fey-3 text-fey-ink':'text-fey-mid')}>{opt}</button>)}</div>}
function NavItem({active,icon,label}){return <button className={cn('flex w-full items-center gap-2.5 rounded-[12px] px-3 py-2 text-[14px] font-semibold',active?'bg-fey-2 text-fey-ink':'text-fey-mid')}>{icon} {label}</button>}
function CopyBtn({text}){const [ok,setOk]=useState(false);return <button onClick={async()=>{await navigator.clipboard.writeText(text);setOk(true);setTimeout(()=>setOk(false),1200)}} className="rounded-[99px] bg-fey-3 px-2.5 py-1 text-[11px] font-semibold text-fey-high">{ok?'Copied':'Copy'}</button>}
function Block({id,name,note,preview,code}){return <section id={id} className="scroll-mt-8 border-t border-white/[0.06] py-10"><div className="mb-4"><h2 className="text-[18px] font-bold text-fey-ink">{name}</h2><p className="mt-1 text-[13px] text-fey-mid">{note}</p></div><div className="rounded-[16px] bg-fey-1 p-[18px]">{preview}</div><div className="mt-3 overflow-hidden rounded-[16px] bg-[#070707]"><div className="flex items-center justify-between px-4 py-2"><span className="text-[11px] font-semibold uppercase tracking-kicker text-fey-low">JSX</span><CopyBtn text={code}/></div><pre className="overflow-x-auto px-4 pb-4 text-[12px] text-fey-high"><code>{code}</code></pre></div></section>}
const TOKENS=[['#000000','background'],['#0b0b0b','surface'],['#131313','raised'],['#1a1b20','inset'],['#ffffff','ink'],['#e6e6e6','high'],['#868f97','mid'],['#787878','low'],['#4ebe96','gain'],['#ef5350','loss'],['#479ffa','link'],['#ffa16c','highlight']];
function App(){
  const [q,setQ]=useState('');
  const [range,setRange]=useState('1Y');
  const [name,setName]=useState('Apple Inc.');
  const [note,setNote]=useState('Watch earnings.');
  const [on,setOn]=useState(true);
  const [check,setCheck]=useState(true);
  const [radio,setRadio]=useState('Equity');
  const [sel,setSel]=useState('USD');
  const [tab,setTab]=useState('Overview');
  const [page,setPage]=useState(1);
  const [slide,setSlide]=useState(64);
  const [modal,setModal]=useState(false);
  const nav=[['tokens','Tokens'],['type','Type'],['pill','PillButton'],['ghost','GhostIcon'],['kbd','Kbd'],['input','TextInput'],['area','TextArea'],['check','Checkbox'],['toggle','Toggle'],['radio','Radio'],['select','Select'],['link','Link'],['divider','Divider'],['avatar','Avatar'],['chip','Chip'],['alert','Alert'],['spinner','Spinner'],['progress','Progress'],['skel','Skeleton'],['tabs','Tabs'],['toast','Toast'],['empty','EmptyState'],['page','Pagination'],['crumb','Breadcrumb'],['slider','Slider'],['menu','MenuRow'],['modal','Modal'],['badge','TickerBadge'],['delta','Delta'],['search','SearchField'],['seg','Segmented'],['nav','NavItem']];
  return (
    <div className="min-h-screen bg-fey-0 text-fey-high">
      <Modal open={modal} onClose={()=>setModal(false)}/>
      <div className="mx-auto grid max-w-[1180px] grid-cols-1 gap-8 px-5 py-8 lg:grid-cols-[220px_1fr]">
        <aside className="lg:sticky lg:top-8 lg:max-h-[calc(100vh-4rem)] lg:self-start lg:overflow-auto">
          <div className="mb-6"><div className="text-[12px] font-semibold uppercase tracking-kicker text-fey-low">Fey-inspired</div><h1 className="mt-1 text-[26px] font-semibold text-fey-ink">Design system</h1></div>
          <nav className="space-y-0.5">{nav.map(([id,label])=><a key={id} href={'#'+id} className="block rounded-[10px] px-2.5 py-1.5 text-[13px] font-semibold text-fey-mid hover:bg-fey-1 hover:text-fey-ink">{label}</a>)}</nav>
        </aside>
        <main>
          <Block id="tokens" name="Tokens" note="Refero colors." preview={<div className="grid grid-cols-2 gap-2 sm:grid-cols-4">{TOKENS.map(([hex,label])=><div key={hex} className="overflow-hidden rounded-[12px] bg-fey-0"><div className="h-14" style={{background:hex}}/><div className="px-2.5 py-2"><div className="text-[12px] font-semibold text-fey-ink">{label}</div><div className="tabular text-[11px] text-fey-mid">{hex}</div></div></div>)}</div>} code={':root { --background:#000; --surface:#0b0b0b; }'}/>
          <Block id="type" name="Type" note="54 / 26 / 18 / 14 / 12." preview={<div className="space-y-3"><div className="text-[54px] font-semibold leading-[1.1] tracking-hero text-fey-ink">$229.87</div><div className="text-[26px] font-semibold text-fey-ink">Markets</div><div className="text-[18px] font-bold text-fey-ink">Headline</div><div className="text-[14px] font-semibold text-fey-high">Body</div></div>} code={'<h1 className="text-[54px] font-semibold tracking-[-0.08em]">$229.87</h1>'}/>
          <Block id="pill" name="PillButton" note="13/400 radius 99." preview={<PillButton>Get started</PillButton>} code={'<button className="rounded-[99px] bg-[#e6e6e6] px-4 py-[7px] text-[13px] text-black">Get started</button>'}/>
          <Block id="ghost" name="GhostIconButton" note="32px circle." preview={<div className="flex gap-2"><GhostIconButton label="Add">+</GhostIconButton><GhostIconButton label="More">...</GhostIconButton></div>} code={'<button className="h-8 w-8 rounded-full bg-[#131313]">+</button>'}/>
          <Block id="kbd" name="Kbd" note="Inset key." preview={<div className="flex gap-1.5"><Kbd>cmd</Kbd><Kbd>K</Kbd></div>} code={'<kbd className="rounded-[6px] bg-[#1a1b20] px-1.5 text-[11px]">cmd K</kbd>'}/>
          <Block id="input" name="TextInput" note="Raised 12 radius." preview={<TextInput label="Name" value={name} onChange={setName} placeholder="Issuer"/>} code={'<input className="h-10 w-full rounded-[12px] bg-[#131313] px-3.5 text-[14px] font-semibold"/>'}/>
          <Block id="area" name="TextArea" note="Same surface as input." preview={<TextArea label="Note" value={note} onChange={setNote}/>} code={'<textarea className="w-full rounded-[12px] bg-[#131313] px-3.5 py-2.5"/>'}/>
          <Block id="check" name="Checkbox" note="4px square." preview={<Checkbox label="Show after hours" checked={check} onChange={setCheck}/>} code={'<span className="h-4 w-4 rounded-[4px] bg-[#e6e6e6]"/>'}/>
          <Block id="toggle" name="Toggle" note="24x40 pill." preview={<div className="flex items-center gap-3"><span className="text-[14px] font-semibold">Alerts</span><Toggle on={on} onChange={setOn}/></div>} code={'<button className="h-6 w-10 rounded-full bg-[#e6e6e6]"/>'}/>
          <Block id="radio" name="Radio" note="Ring when selected." preview={<Radio options={['Equity','ETF','Index']} value={radio} onChange={setRadio}/>} code={'<span className="h-4 w-4 rounded-full ring-1 ring-[#e6e6e6]"/>'}/>
          <Block id="select" name="Select" note="Native, raised." preview={<Select value={sel} options={['USD','EUR','SEK']} onChange={setSel}/>} code={'<select className="h-10 rounded-[12px] bg-[#131313] px-3.5"/>'}/>
          <Block id="link" name="Link" note="#479ffa only." preview={<LinkText>Open filing</LinkText>} code={'<a className="text-[14px] font-semibold text-[#479ffa]">Open filing</a>'}/>
          <Block id="divider" name="Divider" note="4% white hairline." preview={<Divider/>} code={'<div className="h-px bg-white/[0.06]"/>'}/>
          <Block id="avatar" name="Avatar" note="Circle initials." preview={<div className="flex gap-2"><Avatar initials="TC"/><Avatar initials="LM" size={40}/></div>} code={'<span className="inline-flex h-8 w-8 items-center justify-center rounded-full bg-[#131313]">TC</span>'}/>
          <Block id="chip" name="Chip" note="Filter pill." preview={<div className="flex gap-2"><Chip on>Equity</Chip><Chip>ETF</Chip><Chip>Bond</Chip></div>} code={'<span className="rounded-[99px] bg-[#1a1b20] px-2.5 py-1 text-[12px]">Equity</span>'}/>
          <Block id="alert" name="Alert" note="Tone in title only." preview={<div className="space-y-2"><Alert tone="up" title="Beat" body="EPS above consensus."/><Alert tone="down" title="Miss" body="Revenue below estimate."/><Alert tone="link" title="Filing" body="10-Q posted."/></div>} code={'<div className="rounded-[12px] bg-[#131313] px-[18px] py-3">Beat</div>'}/>
          <Block id="spinner" name="Spinner" note="High on inset ring." preview={<Spinner/>} code={'<span className="h-4 w-4 animate-spin rounded-full border-2 border-[#1a1b20] border-t-[#e6e6e6]"/>'}/>
          <Block id="progress" name="Progress" note="High fill." preview={<Progress value={64}/>} code={'<div className="h-1.5 rounded-full bg-[#1a1b20]"><div className="h-full w-[64%] bg-[#e6e6e6]"/></div>'}/>
          <Block id="skel" name="Skeleton" note="Pulse raised bars." preview={<Skeleton/>} code={'<div className="h-4 w-2/3 animate-pulse rounded bg-[#131313]"/>'}/>
          <Block id="tabs" name="Tabs" note="Active ink." preview={<Tabs tabs={['Overview','Financials','Filings']} value={tab} onChange={setTab}/>} code={'<button className="pb-2 text-[14px] font-semibold text-white">Overview</button>'}/>
          <Block id="toast" name="Toast" note="Raised 12." preview={<Toast>Copied AAPL</Toast>} code={'<div className="rounded-[12px] bg-[#131313] px-3.5 py-2">Copied AAPL</div>'}/>
          <Block id="empty" name="EmptyState" note="Title + pill CTA." preview={<EmptyState/>} code={'<div className="rounded-[16px] bg-[#0b0b0b] py-10 text-center">No holdings yet</div>'}/>
          <Block id="page" name="Pagination" note="Ghost + tabular." preview={<Pagination page={page} pages={12} onChange={setPage}/>} code={'<span className="tabular-nums">1 / 12</span>'}/>
          <Block id="crumb" name="Breadcrumb" note="Mid path, ink current." preview={<Breadcrumb/>} code={'Markets / US / AAPL'}/>
          <Block id="slider" name="Slider" note="Accent high." preview={<div className="max-w-sm"><Slider value={slide} onChange={setSlide}/><div className="mt-2 tabular text-[13px] text-fey-mid">{slide}</div></div>} code={'<input type="range" className="accent-[#e6e6e6]"/>'}/>
          <Block id="menu" name="MenuRow" note="Label + hint." preview={<div><MenuRow label="Export CSV" hint="Shift+Cmd+E"/><MenuRow label="Copy link" hint="Cmd+C"/></div>} code={'<button className="flex w-full justify-between rounded-[12px] px-3 py-2.5">Export CSV</button>'}/>
          <Block id="modal" name="Modal" note="16 radius on 70% black." preview={<PillButton onClick={()=>setModal(true)}>Open modal</PillButton>} code={'<div className="rounded-[16px] bg-[#0b0b0b] p-[18px]">Export sheet</div>'}/>
          <Block id="badge" name="TickerBadge" note="Symbol pill." preview={<div className="flex gap-2"><TickerBadge>AAPL</TickerBadge><TickerBadge>NVDA</TickerBadge></div>} code={'<span className="rounded-full bg-[#131313] px-2.5 py-1 text-[12px]">AAPL</span>'}/>
          <Block id="delta" name="Delta" note="Green/red only here." preview={<div className="flex gap-4"><Delta value={1.24}/><Delta value={-0.86}/></div>} code={'<span className="tabular-nums text-[#4ebe96]">+1.24%</span>'}/>
          <Block id="search" name="SearchField" note="Capsule 99." preview={<SearchField value={q} onChange={setQ}/>} code={'<input className="h-10 w-full rounded-[99px] bg-[#131313] px-3.5"/>'}/>
          <Block id="seg" name="SegmentedControl" note="12px uppercase." preview={<SegmentedControl options={['1D','1W','1M','1Y','5Y']} value={range} onChange={setRange}/>} code={'<div className="inline-flex rounded-[99px] bg-[#131313] p-1">1Y</div>'}/>
          <Block id="nav" name="NavItem" note="Active raised fill." preview={<div className="max-w-xs space-y-1"><NavItem active icon="*" label="Markets"/><NavItem icon="#" label="Watchlist"/></div>} code={'<button className="rounded-[12px] bg-[#131313] px-3 py-2">Markets</button>'}/>
          <p className="border-t border-white/[0.06] py-8 text-[12px] text-fey-low">Not affiliated with Fey or Wealthsimple.</p>
        </main>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
