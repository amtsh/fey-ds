<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Fey DS — Markets</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { fey: { 0:"#000",1:"#0b0b0b",2:"#131313",3:"#1a1b20",ink:"#fff",high:"#e6e6e6",mid:"#868f97",low:"#787878",up:"#4ebe96",down:"#ef5350",link:"#479ffa",hot:"#ffa16c" } },
  fontFamily: { sans: ["Inter","sans-serif"] },
  letterSpacing: { hero:"-0.08em", title:"-0.32px", kicker:"0.16em" },
  boxShadow: {
    overlay: "0 0 44px rgba(0,0,0,0.8)",
    sticky: "0 0 35px rgba(0,0,0,0.5)",
    edge: "0 1px 0 rgba(0,0,0,0.85)"
  }
}}}
</script>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root { --hairline: rgba(255,255,255,0.1); }
html,body{background:#000;color:#e6e6e6;margin:0;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
.tabular{font-variant-numeric:tabular-nums}
.hairline{border-color:var(--hairline)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState } = React;
const cn = (...xs) => xs.filter(Boolean).join(" ");
function PillButton({ children, onClick }) {
  return <button onClick={onClick} className="inline-flex items-center rounded-[99px] bg-fey-high px-4 py-[7px] text-[13px] font-normal text-black hover:bg-white">{children}</button>;
}
function GhostIconButton({ label, children, onClick }) {
  return <button aria-label={label} onClick={onClick} className="inline-flex h-8 w-8 items-center justify-center rounded-full bg-fey-2 text-fey-high hover:bg-fey-3">{children}</button>;
}
function Kbd({ children }) {
  return <kbd className="inline-flex h-[22px] min-w-[22px] items-center justify-center rounded-[6px] bg-fey-3 px-1.5 text-[11px] font-semibold text-fey-mid">{children}</kbd>;
}
function TickerBadge({ children }) {
  return <span className="inline-flex rounded-full bg-fey-2 px-2.5 py-1 text-[12px] font-semibold text-fey-ink">{children}</span>;
}
function Delta({ value }) {
  const up = value >= 0;
  return <span className={cn("tabular text-[13px] font-semibold", up ? "text-fey-up" : "text-fey-down")}>{up ? "+" : ""}{value.toFixed(2)}%</span>;
}
function TextInput({ label, value, onChange, placeholder }) {
  return (<label className="block w-full">{label && <span className="mb-1.5 block text-[12px] font-semibold uppercase tracking-kicker text-fey-low">{label}</span>}<input value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder} className="h-10 w-full rounded-[12px] bg-fey-2 px-3.5 text-[14px] font-semibold text-fey-ink outline-none placeholder:text-fey-low" /></label>);
}
function TextArea({ label, value, onChange }) {
  return (<label className="block w-full"><span className="mb-1.5 block text-[12px] font-semibold uppercase tracking-kicker text-fey-low">{label}</span><textarea value={value} onChange={(e) => onChange(e.target.value)} rows={3} className="w-full resize-none rounded-[12px] bg-fey-2 px-3.5 py-2.5 text-[14px] font-semibold text-fey-ink outline-none" /></label>);
}
function Checkbox({ label, checked, onChange }) {
  return (<button type="button" onClick={() => onChange(!checked)} className="flex items-center gap-2.5 text-[14px] font-semibold text-fey-ink"><span className={cn("flex h-4 w-4 items-center justify-center rounded-[4px]", checked ? "bg-fey-high text-black" : "bg-fey-3")}>{checked ? "\u2713" : ""}</span>{label}</button>);
}
function Toggle({ on, onChange }) {
  return (<button type="button" onClick={() => onChange(!on)} className={cn("relative h-6 w-10 rounded-full", on ? "bg-fey-high" : "bg-fey-3")}><span className={cn("absolute top-0.5 h-5 w-5 rounded-full bg-black transition", on ? "left-4" : "left-0.5")} /></button>);
}
function Radio({ options, value, onChange }) {
  return (<div className="space-y-2">{options.map((opt) => (<button key={opt} type="button" onClick={() => onChange(opt)} className="flex items-center gap-2.5 text-[14px] font-semibold text-fey-ink"><span className={cn("flex h-4 w-4 items-center justify-center rounded-full bg-fey-3", value === opt && "ring-1 ring-fey-high")}>{value === opt && <span className="h-2 w-2 rounded-full bg-fey-high" />}</span>{opt}</button>))}</div>);
}
function Select({ value, options, onChange }) {
  return (<select value={value} onChange={(e) => onChange(e.target.value)} className="h-10 w-full rounded-[12px] bg-fey-2 px-3.5 text-[14px] font-semibold text-fey-ink outline-none">{options.map((o) => <option key={o}>{o}</option>)}</select>);
}
function LinkText({ children, href = "#" }) {
  return <a href={href} className="text-[14px] font-semibold text-fey-link hover:underline">{children}</a>;
}
function Divider() { return <div className="h-px w-full bg-white/10" />; }
function Avatar({ initials, size = 32 }) {
  return <span className="inline-flex items-center justify-center rounded-full bg-fey-2 text-[12px] font-semibold text-fey-ink" style={{ width: size, height: size }}>{initials}</span>;
}
function Chip({ children, on, onClick }) {
  return <button onClick={onClick} className={cn("inline-flex rounded-[99px] px-2.5 py-1 text-[12px] font-semibold", on ? "bg-fey-3 text-fey-ink" : "bg-fey-2 text-fey-mid")}>{children}</button>;
}
function Alert({ tone, title, body }) {
  const color = tone === "up" ? "text-fey-up" : tone === "down" ? "text-fey-down" : "text-fey-link";
  return <div className="rounded-[12px] bg-fey-2 px-[18px] py-3"><div className={cn("text-[13px] font-semibold", color)}>{title}</div><div className="mt-1 text-[13px] text-fey-mid">{body}</div></div>;
}
function Spinner() { return <span className="inline-block h-4 w-4 animate-spin rounded-full border-2 border-fey-3 border-t-fey-high" />; }
function Progress({ value }) {
  return <div className="h-1.5 w-full overflow-hidden rounded-full bg-fey-3"><div className="h-full rounded-full bg-fey-high" style={{ width: value + "%" }} /></div>;
}
function Skeleton() {
  return <div className="space-y-2"><div className="h-4 w-2/3 animate-pulse rounded bg-fey-2" /><div className="h-4 w-full animate-pulse rounded bg-fey-2" /><div className="h-4 w-5/6 animate-pulse rounded bg-fey-2" /></div>;
}
function Tabs({ tabs, value, onChange }) {
  return <div className="flex gap-5 border-b border-white/10">{tabs.map((t) => <button key={t} onClick={() => onChange(t)} className={cn("pb-2 text-[14px] font-semibold", value === t ? "text-fey-ink" : "text-fey-mid")}>{t}</button>)}</div>;
}
function Toast({ children, onClose }) {
  return <div className="inline-flex items-center gap-3 rounded-[12px] bg-fey-2 px-3.5 py-2 text-[13px] font-semibold text-fey-ink shadow-overlay">{children}<button onClick={onClose} className="text-fey-low">x</button></div>;
}
function EmptyState({ onAdd }) {
  return <div className="rounded-[16px] bg-fey-1 px-6 py-10 text-center"><div className="text-[18px] font-bold text-fey-ink">No filings in range</div><p className="mt-2 text-[14px] font-semibold text-fey-mid">Widen the period or add a ticker.</p><div className="mt-4"><PillButton onClick={onAdd}>Add ticker</PillButton></div></div>;
}
function Pagination({ page, pages, onChange }) {
  return (<div className="flex items-center gap-2"><GhostIconButton label="Prev" onClick={() => onChange(Math.max(1, page - 1))}>{'\u2039'}</GhostIconButton><span className="tabular text-[13px] font-semibold text-fey-mid">{page} / {pages}</span><GhostIconButton label="Next" onClick={() => onChange(Math.min(pages, page + 1))}>{'\u203A'}</GhostIconButton></div>);
}
function Breadcrumb({ parts }) {
  return (<div className="flex items-center gap-2 text-[13px] font-semibold">{parts.map((p, i) => (<span key={p} className="flex items-center gap-2">{i > 0 && <span className="text-fey-low">/</span>}<span className={i === parts.length - 1 ? "text-fey-ink" : "text-fey-mid"}>{p}</span></span>))}</div>);
}
function Slider({ value, onChange }) {
  return <input type="range" min="0" max="100" value={value} onChange={(e) => onChange(Number(e.target.value))} className="w-full accent-[#e6e6e6]" />;
}
function MenuRow({ label, hint, onClick }) {
  return <button onClick={onClick} className="flex w-full items-center justify-between rounded-[12px] px-3 py-2.5 text-left hover:bg-fey-2"><span className="text-[14px] font-semibold text-fey-ink">{label}</span><span className="text-[12px] font-semibold text-fey-low">{hint}</span></button>;
}
function SearchField({ value, onChange, onFocus }) {
  return (<label className="flex h-10 w-full items-center rounded-[99px] bg-fey-2 px-3.5"><input value={value} onFocus={onFocus} onChange={(e) => onChange(e.target.value)} placeholder="Search tickers, filings, news" className="w-full bg-transparent text-[14px] font-semibold text-fey-high outline-none placeholder:text-fey-low" /></label>);
}
function SegmentedControl({ options, value, onChange }) {
  return (<div className="inline-flex rounded-[99px] bg-fey-2 p-1">{options.map((opt) => <button key={opt} onClick={() => onChange(opt)} className={cn("rounded-[99px] px-3 py-1 text-[12px] font-semibold uppercase tracking-kicker", value === opt ? "bg-fey-3 text-fey-ink" : "text-fey-mid")}>{opt}</button>)}</div>);
}
function NavItem({ active, icon, label, onClick }) {
  return <button onClick={onClick} className={cn("flex w-full items-center gap-2.5 rounded-[12px] px-3 py-2 text-left text-[14px] font-semibold", active ? "bg-fey-2 text-fey-ink" : "text-fey-mid hover:text-fey-high")}>{icon} {label}</button>;
}
function SurfaceCard({ children, className }) {
  return <div className={cn("rounded-[16px] bg-fey-1 p-[18px]", className)}>{children}</div>;
}
function NewsCard({ source, time, title, body }) {
  return (<SurfaceCard><div className="mb-2 text-[12px] font-semibold uppercase tracking-kicker"><span className="text-fey-hot">{source}</span><span className="text-fey-mid"> \u00b7 {time}</span></div><h3 className="text-[18px] font-bold leading-[1.4] tracking-title text-fey-ink">{title}</h3><p className="mt-2 text-[14px] font-semibold leading-[1.5] text-fey-mid">{body}</p></SurfaceCard>);
}
function InsiderRow({ name, role, action, shares, value }) {
  const buy = action === "Buy";
  return (<div className="flex items-center justify-between rounded-[12px] bg-fey-0 px-[18px] py-3"><div className="flex items-center gap-3"><Avatar initials={name.split(" ").map((x)=>x[0]).join("")} /><div><div className="text-[14px] font-semibold text-fey-ink">{name}</div><div className="text-[12px] text-fey-mid">{role}</div></div></div><div className="text-right"><div className={cn("text-[13px] font-semibold", buy ? "text-fey-up" : "text-fey-down")}>{action}</div><div className="tabular text-[12px] text-fey-mid">{shares} \u00b7 {value}</div></div></div>);
}
function Sparkline({ data, up = true, width = 72, height = 28 }) {
  const min = Math.min(...data), max = Math.max(...data);
  const pts = data.map((v, i) => `${(i / (data.length - 1)) * width},${height - ((v - min) / (max - min || 1)) * (height - 4) - 2}`).join(" ");
  return <svg width={width} height={height}><polyline fill="none" stroke={up ? "#4ebe96" : "#ef5350"} strokeWidth="1.6" strokeLinejoin="round" points={pts} /></svg>;
}
function WatchlistRow({ ticker, name, price, change, data, onClick }) {
  return (<button onClick={onClick} className="flex w-full items-center gap-3 rounded-[12px] px-2 py-2.5 text-left hover:bg-fey-2"><TickerBadge>{ticker}</TickerBadge><div className="min-w-0 flex-1 truncate text-[14px] font-semibold text-fey-ink">{name}</div><Sparkline data={data} up={change >= 0} /><div className="w-[72px] text-right"><div className="tabular text-[14px] font-semibold text-fey-ink">{price}</div><Delta value={change} /></div></button>);
}
function TickerHero({ ticker, name, price, change }) {
  return (<div><div className="flex items-center gap-2"><TickerBadge>{ticker}</TickerBadge><span className="text-[14px] font-semibold text-fey-mid">{name}</span><Chip on>Equity</Chip></div><div className="mt-4 flex flex-wrap items-end gap-3"><div className="tabular text-[54px] font-semibold leading-[1.1] tracking-hero text-fey-ink">{price}</div><div className="mb-2"><Delta value={change} /></div></div><div className="mt-5 overflow-x-auto"><Sparkline data={[210,214,212,218,221,219,226,229,227,232,230,236]} up width={520} height={64} /></div></div>);
}
function DataTable() {
  const rows = [["Revenue","394.3B","383.3B","+2.9%"],["Gross profit","180.7B","170.8B","+5.8%"],["Operating income","123.2B","114.3B","+7.8%"],["Net income","93.7B","97.0B","-3.4%"],["EPS","6.08","6.42","-5.3%"]];
  return (<div className="overflow-hidden rounded-[16px] bg-fey-0"><table className="w-full text-left"><thead><tr className="text-[12px] font-semibold uppercase tracking-kicker text-fey-low"><th className="px-[18px] py-3">Metric</th><th className="px-[18px] py-3">FY24</th><th className="px-[18px] py-3">FY23</th><th className="px-[18px] py-3">YoY</th></tr></thead><tbody>{rows.map((r) => (<tr key={r[0]} className="border-t border-white/10"><td className="px-[18px] py-3 text-[14px] font-semibold text-fey-ink">{r[0]}</td><td className="tabular px-[18px] py-3 text-[14px] font-semibold text-fey-high">{r[1]}</td><td className="tabular px-[18px] py-3 text-[14px] font-semibold text-fey-mid">{r[2]}</td><td className={cn("tabular px-[18px] py-3 text-[14px] font-semibold", r[3].startsWith("-") ? "text-fey-down" : "text-fey-up")}>{r[3]}</td></tr>))}</tbody></table></div>);
}
function EarningsChip({ date, when }) {
  return <span className="inline-flex items-center gap-2 rounded-[99px] bg-fey-2 px-3 py-1.5 text-[12px] font-semibold"><span className="text-fey-ink">{date}</span><span className="text-fey-link">{when}</span></span>;
}
function StatTile({ label, value, change }) {
  return <div className="rounded-[12px] bg-fey-0 px-3.5 py-3"><div className="text-[12px] font-semibold uppercase tracking-kicker text-fey-low">{label}</div><div className="mt-1 tabular text-[18px] font-bold text-fey-ink">{value}</div>{change != null && <Delta value={change} />}</div>;
}
function StatusDot({ on }) {
  return <span className={cn("inline-block h-1.5 w-1.5 rounded-full", on ? "bg-fey-up" : "bg-fey-low")} />;
}
function CommandPalette({ open, onClose, onPick }) {
  const [q, setQ] = useState("");
  const items = [{k:"AAPL",t:"Apple Inc.",hint:"Equity"},{k:"MSFT",t:"Microsoft Corp.",hint:"Equity"},{k:"NVDA",t:"NVIDIA Corp.",hint:"Equity"},{k:"Filings",t:"Latest 10-K / 10-Q",hint:"Docs"}].filter((x) => (x.k + x.t).toLowerCase().includes(q.toLowerCase()));
  if (!open) return null;
  return (<div className="fixed inset-0 z-50 flex items-start justify-center bg-black/70 pt-[12vh]" onClick={onClose}><div className="w-[min(560px,92vw)] overflow-hidden rounded-[16px] bg-fey-1 shadow-overlay" onClick={(e) => e.stopPropagation()}><div className="flex items-center gap-2 border-b border-white/10 px-[18px] py-3"><input autoFocus value={q} onChange={(e) => setQ(e.target.value)} placeholder="Jump to ticker, filing, or command" className="w-full bg-transparent text-[16px] font-medium text-fey-ink outline-none" /><Kbd>esc</Kbd></div><div className="p-2">{items.map((it, i) => (<button key={it.k} onClick={() => { onPick && onPick(it.k); onClose(); }} className={cn("flex w-full items-center justify-between rounded-[12px] px-3 py-2.5 text-left", i === 0 && "bg-fey-2")}><div><div className="text-[14px] font-semibold text-fey-ink">{it.k}</div><div className="text-[12px] text-fey-mid">{it.t}</div></div><span className="text-[11px] font-semibold uppercase tracking-kicker text-fey-low">{it.hint}</span></button>))}</div></div></div>);
}
function Modal({ open, onClose }) {
  if (!open) return null;
  return (<div className="fixed inset-0 z-40 flex items-center justify-center bg-black/70" onClick={onClose}><div className="w-[min(400px,92vw)] rounded-[16px] bg-fey-1 p-[18px] shadow-overlay" onClick={(e) => e.stopPropagation()}><div className="text-[18px] font-bold text-fey-ink">Export sheet</div><p className="mt-2 text-[14px] font-semibold text-fey-mid">Download financials as CSV.</p><div className="mt-4 flex justify-end gap-2"><button onClick={onClose} className="rounded-[99px] px-3 py-1.5 text-[13px] font-semibold text-fey-mid">Cancel</button><PillButton onClick={onClose}>Export</PillButton></div></div></div>);
}
function App() {
  const [nav, setNav] = useState("Markets");
  const [q, setQ] = useState("");
  const [range, setRange] = useState("1Y");
  const [tab, setTab] = useState("Overview");
  const [cmd, setCmd] = useState(false);
  const [modal, setModal] = useState(false);
  const [toast, setToast] = useState(true);
  const [alerts, setAlerts] = useState(true);
  const [ah, setAh] = useState(true);
  const [asset, setAsset] = useState("Equity");
  const [ccy, setCcy] = useState("USD");
  const [note, setNote] = useState("Watch services mix and buybacks.");
  const [alias, setAlias] = useState("AAPL");
  const [slide, setSlide] = useState(64);
  const [page, setPage] = useState(1);
  const [filter, setFilter] = useState("All");
  const [loading, setLoading] = useState(false);
  React.useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); setCmd(true); }
      if (e.key === "Escape") { setCmd(false); setModal(false); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);
  const watch = [
    { ticker:"AAPL", name:"Apple", price:"$229.87", change:1.24, data:[210,214,218,221,226,229] },
    { ticker:"MSFT", name:"Microsoft", price:"$428.10", change:-0.42, data:[440,436,432,430,429,428] },
    { ticker:"NVDA", name:"NVIDIA", price:"$172.64", change:2.41, data:[150,154,160,164,168,172] }
  ];
  return (
    <div className="min-h-screen bg-fey-0 text-fey-high">
      <CommandPalette open={cmd} onClose={() => setCmd(false)} onPick={(k) => setAlias(k)} />
      <Modal open={modal} onClose={() => setModal(false)} />
      {toast && (<div className="fixed bottom-5 right-5 z-30"><Toast onClose={() => setToast(false)}>Copied {alias}</Toast></div>)}
      <div className="mx-auto grid max-w-[1280px] grid-cols-1 lg:grid-cols-[240px_1fr_300px]">
        <aside className="border-b border-white/10 p-4 lg:border-b-0 lg:border-r">
          <div className="mb-6 flex items-center justify-between"><div><div className="text-[12px] font-semibold uppercase tracking-kicker text-fey-low">Fey-inspired</div><div className="text-[18px] font-bold text-fey-ink">Markets</div></div><StatusDot on /></div>
          <div className="space-y-0.5">{[["Markets","*"],["Watchlist","#"],["Filings","="],["News","~"],["Settings","o"]].map(([label, icon]) => (<NavItem key={label} icon={icon} label={label} active={nav === label} onClick={() => setNav(label)} />))}</div>
          <Divider />
          <div className="mt-4 space-y-1"><MenuRow label="Export CSV" hint="Shift+Cmd+E" onClick={() => setModal(true)} /><MenuRow label="Copy link" hint="Cmd+C" onClick={() => setToast(true)} /><MenuRow label="Command" hint="Cmd+K" onClick={() => setCmd(true)} /></div>
          <div className="mt-6 flex items-center gap-3"><Avatar initials="AS" size={36} /><div><div className="text-[14px] font-semibold text-fey-ink">Amit</div><div className="text-[12px] text-fey-mid">Workspace</div></div></div>
        </aside>
        <main className="min-w-0 p-5">
          <header className="sticky top-0 z-20 -mx-5 mb-5 bg-fey-0 px-5 py-3 shadow-sticky">
            <div className="flex flex-wrap items-center gap-3">
              <Breadcrumb parts={["Markets","US", alias]} />
              <div className="ml-auto flex items-center gap-2">
                <div className="w-[min(320px,100%)]"><SearchField value={q} onChange={setQ} onFocus={() => setCmd(true)} /></div>
                <GhostIconButton label="Add">+</GhostIconButton>
                <GhostIconButton label="More" onClick={() => setModal(true)}>...</GhostIconButton>
                <span className="hidden items-center gap-1 sm:flex"><Kbd>cmd</Kbd><Kbd>K</Kbd></span>
              </div>
            </div>
          </header>
          {nav === "Settings" ? (
            <SurfaceCard>
              <h2 className="text-[18px] font-bold text-fey-ink">Workspace</h2>
              <p className="mt-1 text-[14px] font-semibold text-fey-mid">Defaults for research views.</p>
              <div className="mt-5 grid gap-5 sm:grid-cols-2">
                <TextInput label="Default ticker" value={alias} onChange={setAlias} placeholder="AAPL" />
                <div><span className="mb-1.5 block text-[12px] font-semibold uppercase tracking-kicker text-fey-low">Currency</span><Select value={ccy} options={["USD","EUR","SEK"]} onChange={setCcy} /></div>
                <div><span className="mb-1.5 block text-[12px] font-semibold uppercase tracking-kicker text-fey-low">Asset class</span><Radio options={["Equity","ETF","Index"]} value={asset} onChange={setAsset} /></div>
                <TextArea label="Research note" value={note} onChange={setNote} />
              </div>
              <Divider />
              <div className="mt-4 flex items-center justify-between"><span className="text-[14px] font-semibold">Price alerts</span><Toggle on={alerts} onChange={setAlerts} /></div>
              <div className="mt-3"><Checkbox label="Show after hours" checked={ah} onChange={setAh} /></div>
              <div className="mt-5"><div className="mb-2 flex justify-between text-[12px] font-semibold uppercase tracking-kicker text-fey-low"><span>Conviction</span><span className="tabular text-fey-mid">{slide}</span></div><Slider value={slide} onChange={setSlide} /><Progress value={slide} /></div>
              <div className="mt-5"><PillButton onClick={() => setToast(true)}>Save</PillButton></div>
            </SurfaceCard>
          ) : nav === "Watchlist" ? (
            <SurfaceCard>
              <div className="mb-3 flex items-center justify-between"><h2 className="text-[18px] font-bold text-fey-ink">Watchlist</h2><PillButton onClick={() => setCmd(true)}>Add ticker</PillButton></div>
              {watch.map((w) => <WatchlistRow key={w.ticker} {...w} onClick={() => { setAlias(w.ticker); setNav("Markets"); }} />)}
            </SurfaceCard>
          ) : nav === "Filings" ? (
            <div className="space-y-4"><EmptyState onAdd={() => setCmd(true)} /><div className="flex justify-end"><Pagination page={page} pages={8} onChange={setPage} /></div></div>
          ) : nav === "News" ? (
            <div className="space-y-4">
              <div className="flex flex-wrap gap-2">{["All","Macro","Product","M&A"].map((c) => <Chip key={c} on={filter === c} onClick={() => setFilter(c)}>{c}</Chip>)}</div>
              <NewsCard source="Bloomberg" time="2h" title="Apple raises services guidance after record quarter" body="Installed base and mix shift lift high-margin revenue. Hardware units stay flat." />
              <NewsCard source="Reuters" time="5h" title="Buyback authorization expanded" body="Board adds $100B. Cash return remains the core capital-allocation story." />
              <div className="flex items-center justify-between"><LinkText>Open all filings</LinkText><Pagination page={page} pages={4} onChange={setPage} /></div>
            </div>
          ) : (
            <div className="space-y-5">
              <SurfaceCard>
                <div className="mb-4 flex flex-wrap items-center justify-between gap-3">
                  <TickerHero ticker={alias} name={alias === "AAPL" ? "Apple Inc." : alias} price="$229.87" change={1.24} />
                  <div className="flex flex-col items-end gap-2">
                    <SegmentedControl options={["1D","1W","1M","1Y","5Y"]} value={range} onChange={(v) => { setRange(v); setLoading(true); setTimeout(() => setLoading(false), 600); }} />
                    <EarningsChip date="Oct 31" when="AMC" />
                    <div className="flex gap-2"><PillButton onClick={() => setModal(true)}>Export</PillButton></div>
                  </div>
                </div>
                {loading ? <Skeleton /> : (<div className="mt-4 grid grid-cols-2 gap-2 sm:grid-cols-4"><StatTile label="Mkt cap" value="3.48T" change={1.1} /><StatTile label="P/E" value="35.2" change={-0.4} /><StatTile label="Rev TTM" value="394B" change={2.9} /><StatTile label="Margin" value="46.2%" change={0.6} /></div>)}
              </SurfaceCard>
              <div className="flex items-center gap-3"><Tabs tabs={["Overview","Financials","Holders"]} value={tab} onChange={setTab} />{loading && <Spinner />}</div>
              {tab === "Overview" && (<div className="grid gap-4 lg:grid-cols-2"><Alert tone="up" title="Beat" body="EPS above consensus. Services mix helped." /><Alert tone="link" title="Filing" body="10-Q posted this morning." /><NewsCard source="Bloomberg" time="2h" title="Apple raises services guidance after record quarter" body="Installed base and mix shift lift high-margin revenue." /><SurfaceCard><div className="mb-3 text-[12px] font-semibold uppercase tracking-kicker text-fey-low">Insiders</div><div className="space-y-2"><InsiderRow name="T. Cook" role="CEO" action="Buy" shares="25,000" value="$5.7M" /><InsiderRow name="L. Maestri" role="CFO" action="Sell" shares="10,400" value="$2.4M" /></div></SurfaceCard></div>)}
              {tab === "Financials" && (<div><DataTable /><div className="mt-3 flex justify-end"><Pagination page={page} pages={3} onChange={setPage} /></div></div>)}
              {tab === "Holders" && <EmptyState onAdd={() => setTab("Overview")} />}
            </div>
          )}
        </main>
        <aside className="border-t border-white/10 p-4 lg:border-l lg:border-t-0">
          <div className="mb-3 flex items-center justify-between"><div className="text-[12px] font-semibold uppercase tracking-kicker text-fey-low">Watchlist</div><GhostIconButton label="Add" onClick={() => setCmd(true)}>+</GhostIconButton></div>
          {watch.map((w) => <WatchlistRow key={w.ticker} {...w} onClick={() => { setAlias(w.ticker); setNav("Markets"); }} />)}
          <Divider />
          <div className="mt-4 text-[12px] font-semibold uppercase tracking-kicker text-fey-low">Coverage</div>
          <div className="mt-2 flex flex-wrap gap-2"><Chip on>US</Chip><Chip>EU</Chip><Chip>Asia</Chip></div>
          <div className="mt-4"><Alert tone="down" title="Miss risk" body="iPhone units still the swing factor." /></div>
          <div className="mt-4 text-[12px] text-fey-low">Not affiliated with Fey or Wealthsimple. <LinkText href="https://github.com/amtsh/fey-ds">Source</LinkText></div>
        </aside>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
