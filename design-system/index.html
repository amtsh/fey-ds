<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Fey DS — Design System</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{fey:{0:'#000',1:'#0b0b0b',2:'#131313',3:'#1a1b20',ink:'#fff',high:'#e6e6e6',mid:'#868f97',low:'#787878',up:'#4ebe96',down:'#ef5350',link:'#479ffa',hot:'#ffa16c'}},fontFamily:{sans:['-apple-system','BlinkMacSystemFont','SF Pro Text','SF Pro Display','system-ui','Segoe UI','sans-serif']},letterSpacing:{hero:'-0.08em',title:'-0.32px',kicker:'0.16em'},boxShadow:{overlay:'0 0 44px rgba(0,0,0,.8)',sticky:'0 0 35px rgba(0,0,0,.5)'}}}}</script>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script><script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>html,body{background:#000;color:#e6e6e6;margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}.tabular{font-variant-numeric:tabular-nums}pre{tab-size:2}</style>
</head><body><div id="root"></div><script type="text/babel" data-presets="react">
const {useState}=React;const cn=(...x)=>x.filter(Boolean).join(' ');
const Button=({children,onClick})=><button onClick={onClick} className="rounded-[99px] bg-fey-high px-4 py-[7px] text-[13px] font-normal text-black hover:bg-white">{children}</button>;
const Icon=({label,children,onClick})=><button aria-label={label} onClick={onClick} className="inline-flex h-8 w-8 items-center justify-center rounded-full bg-fey-2 text-fey-high hover:bg-fey-3">{children}</button>;
const Kbd=({children})=><kbd className="inline-flex h-[22px] min-w-[22px] items-center justify-center rounded-[6px] bg-fey-3 px-1.5 text-[11px] font-semibold text-fey-mid">{children}</kbd>;
const Badge=({children})=><span className="rounded-full bg-fey-2 px-2.5 py-1 text-[12px] font-semibold text-fey-ink">{children}</span>;
const Delta=({value})=><span className={cn('tabular text-[13px] font-semibold',value>=0?'text-fey-up':'text-fey-down')}>{value>=0?'+':''}{value.toFixed(2)}%</span>;
const Card=({children})=><div className="rounded-[16px] bg-fey-1 p-[18px]">{children}</div>;
const Divider=()=> <div className="h-px w-full bg-white/10"/>;
function Input({value,setValue}){return <input value={value} onChange={e=>setValue(e.target.value)} placeholder="Search ticker" className="h-10 w-full rounded-[12px] bg-fey-2 px-3.5 text-[14px] font-semibold text-fey-ink outline-none placeholder:text-fey-low"/>}
function TextArea({value,setValue}){return <textarea value={value} onChange={e=>setValue(e.target.value)} rows={3} className="w-full resize-none rounded-[12px] bg-fey-2 px-3.5 py-2.5 text-[14px] font-semibold text-fey-ink outline-none"/>}
function Checkbox({on,setOn}){return <button onClick={()=>setOn(!on)} className="flex items-center gap-2.5 text-[14px] font-semibold"><span className={cn('flex h-4 w-4 items-center justify-center rounded-[4px]',on?'bg-fey-high text-black':'bg-fey-3')}>{on?'✓':''}</span>Show after hours</button>}
function Toggle({on,setOn}){return <button onClick={()=>setOn(!on)} className={cn('relative h-6 w-10 rounded-full',on?'bg-fey-high':'bg-fey-3')}><span className={cn('absolute top-0.5 h-5 w-5 rounded-full bg-black',on?'left-4':'left-0.5')}/></button>}
function Radio({value,setValue}){return <div className="space-y-2">{['Equity','ETF','Index'].map(o=><button key={o} onClick={()=>setValue(o)} className="flex items-center gap-2.5 text-[14px] font-semibold"><span className={cn('flex h-4 w-4 items-center justify-center rounded-full bg-fey-3',value===o&&'ring-1 ring-fey-high')}>{value===o&&<span className="h-2 w-2 rounded-full bg-fey-high"/>}</span>{o}</button>)}</div>}
function Select({value,setValue}){return <select value={value} onChange={e=>setValue(e.target.value)} className="h-10 rounded-[12px] bg-fey-2 px-3.5 text-[14px] font-semibold text-fey-ink"><option>USD</option><option>EUR</option><option>SEK</option></select>}
function Chips(){const [v,setV]=useState('Equity');return <div className="flex gap-2">{['Equity','ETF','Index'].map(x=><button key={x} onClick={()=>setV(x)} className={cn('rounded-[99px] px-2.5 py-1 text-[12px] font-semibold',v===x?'bg-fey-3 text-fey-ink':'bg-fey-2 text-fey-mid')}>{x}</button>)}</div>}
function Alert({tone,title}){return <div className="rounded-[12px] bg-fey-2 px-[18px] py-3"><div className={cn('text-[13px] font-semibold',tone==='up'?'text-fey-up':tone==='down'?'text-fey-down':'text-fey-link')}>{title}</div><div className="mt-1 text-[13px] text-fey-mid">Supporting message for the user.</div></div>}
const Spinner=()=> <span className="inline-block h-4 w-4 animate-spin rounded-full border-2 border-fey-3 border-t-fey-high"/>;
const Progress=({value=64})=><div className="h-1.5 w-full overflow-hidden rounded-full bg-fey-3"><div className="h-full rounded-full bg-fey-high" style={{width:value+'%'}}/></div>;
const Skeleton=()=> <div className="space-y-2"><div className="h-4 w-2/3 animate-pulse rounded bg-fey-2"/><div className="h-4 w-full animate-pulse rounded bg-fey-2"/><div className="h-4 w-5/6 animate-pulse rounded bg-fey-2"/></div>;
function Tabs(){const [v,setV]=useState('Overview');return <div className="flex gap-5 border-b border-white/10">{['Overview','Financials','Filings'].map(x=><button key={x} onClick={()=>setV(x)} className={cn('pb-2 text-[14px] font-semibold',v===x?'text-fey-ink':'text-fey-mid')}>{x}</button>)}</div>}
function Spark({down=false,width=72}){return <svg width={width} height="28"><polyline fill="none" stroke={down?'#ef5350':'#4ebe96'} strokeWidth="1.6" points={down?'0,8 12,10 24,8 36,15 48,17 60,23 72,25':'0,24 12,20 24,22 36,14 48,16 60,8 72,10'}/></svg>}
function Table(){return <div className="overflow-hidden rounded-[16px] bg-fey-0"><table className="w-full text-left"><thead className="text-[12px] font-semibold uppercase tracking-kicker text-fey-low"><tr><th className="px-[18px] py-3">Metric</th><th className="px-[18px] py-3">FY24</th><th className="px-[18px] py-3">YoY</th></tr></thead><tbody>{[['Revenue','394.3B','+2.9%'],['Gross profit','180.7B','+5.8%'],['Net income','93.7B','-3.4%']].map(r=><tr key={r[0]} className="border-t border-white/10"><td className="px-[18px] py-3 text-[14px] font-semibold text-fey-ink">{r[0]}</td><td className="tabular px-[18px] py-3 text-[14px] font-semibold">{r[1]}</td><td className={cn('tabular px-[18px] py-3 text-[14px] font-semibold',r[2][0]==='-'?'text-fey-down':'text-fey-up')}>{r[2]}</td></tr>)}</tbody></table></div>}
function Copy({text}){const [ok,setOk]=useState(false);return <button onClick={async()=>{await navigator.clipboard.writeText(text);setOk(true);setTimeout(()=>setOk(false),1000)}} className="rounded-[99px] bg-fey-3 px-2.5 py-1 text-[11px] font-semibold text-fey-high">{ok?'Copied':'Copy'}</button>}
function Section({id,name,note,children,code}){return <section id={id} className="scroll-mt-5 border-t border-white/10 py-9"><div className="mb-4 flex items-end justify-between"><div><h2 className="text-[18px] font-bold tracking-title text-fey-ink">{name}</h2><p className="mt-1 text-[13px] text-fey-mid">{note}</p></div><a href={'#'+id} className="text-[12px] text-fey-low">#{id}</a></div><div className="rounded-[16px] bg-fey-1 p-[18px]">{children}</div><div className="mt-3 overflow-hidden rounded-[16px] bg-[#070707]"><div className="flex justify-between px-4 py-2"><span className="text-[11px] uppercase tracking-kicker text-fey-low">JSX</span><Copy text={code}/></div><pre className="overflow-x-auto px-4 pb-4 text-[12px] text-fey-high"><code>{code}</code></pre></div></section>}
const colors=[['#000000','background'],['#0b0b0b','surface'],['#131313','raised'],['#1a1b20','inset'],['#ffffff','ink'],['#e6e6e6','high'],['#868f97','mid'],['#787878','low'],['#4ebe96','gain'],['#ef5350','loss'],['#479ffa','link'],['#ffa16c','highlight']];
function App(){const [text,setText]=useState('Apple Inc.'),[area,setArea]=useState('Watch earnings.'),[on,setOn]=useState(true),[check,setCheck]=useState(true),[radio,setRadio]=useState('Equity'),[select,setSelect]=useState('USD');return <div className="min-h-screen bg-fey-0"><div className="mx-auto grid max-w-[1180px] grid-cols-1 gap-8 px-5 py-8 lg:grid-cols-[210px_1fr]"><aside className="lg:sticky lg:top-8 lg:max-h-[calc(100vh-4rem)] lg:self-start lg:overflow-auto"><a href="../" className="mb-6 block text-[12px] font-semibold text-fey-link">← Markets app</a><div className="text-[12px] font-semibold uppercase tracking-kicker text-fey-low">Fey-inspired</div><h1 className="mt-1 text-[26px] font-semibold text-fey-ink">Design system</h1><p className="mt-2 text-[13px] text-fey-mid">React + Tailwind · SF Pro stack</p><nav className="mt-6 space-y-1">{[['tokens','Tokens'],['type','Type'],['buttons','Buttons'],['forms','Forms'],['selection','Selection'],['feedback','Feedback'],['data','Data'],['layout','Layout'],['overlays','Overlays']].map(([id,l])=><a key={id} href={'#'+id} className="block rounded-[10px] px-2.5 py-1.5 text-[13px] font-semibold text-fey-mid hover:bg-fey-1 hover:text-fey-ink">{l}</a>)}</nav></aside><main>
<Section id="tokens" name="Tokens" note="Pure-black canvas. Color reserved for meaning." code={`const colors = { background:'#000', surface:'#0b0b0b', raised:'#131313', gain:'#4ebe96' };`}><div className="grid grid-cols-2 gap-2 sm:grid-cols-4">{colors.map(([hex,label])=><div key={hex} className="overflow-hidden rounded-[12px] bg-fey-0"><div className="h-14" style={{background:hex}}/><div className="px-2.5 py-2"><div className="text-[12px] font-semibold text-fey-ink">{label}</div><div className="text-[11px] text-fey-mid">{hex}</div></div></div>)}</div></Section>
<Section id="type" name="Type" note="54 / 26 / 18 / 14 / 12. System stack uses SF Pro on Apple." code={`font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui;`}><div className="space-y-3"><div className="text-[54px] font-semibold leading-[1.1] tracking-hero text-fey-ink">$229.87</div><div className="text-[26px] font-semibold text-fey-ink">Markets</div><div className="text-[18px] font-bold tracking-title text-fey-ink">Headline</div><div className="text-[14px] font-semibold text-fey-high">Body text</div><div className="text-[12px] font-semibold uppercase tracking-kicker text-fey-low">Label</div></div></Section>
<Section id="buttons" name="Buttons" note="Light primary, raised icon actions, keyboard hints." code={`<button className="rounded-[99px] bg-[#e6e6e6] px-4 py-[7px] text-[13px] text-black">Export</button>`}><div className="flex flex-wrap items-center gap-3"><Button>Get started</Button><Button>Export</Button><Icon label="Add">+</Icon><Icon label="More">···</Icon><Kbd>cmd</Kbd><Kbd>K</Kbd></div></Section>
<Section id="forms" name="Forms" note="Raised #131313 surfaces, radius 12." code={`<input className="h-10 rounded-[12px] bg-[#131313] px-3.5" />`}><div className="grid gap-4 sm:grid-cols-2"><Input value={text} setValue={setText}/><TextArea value={area} setValue={setArea}/><Select value={select} setValue={setSelect}/><div className="flex h-10 items-center rounded-[99px] bg-fey-2 px-3.5 text-[14px] text-fey-low">Search tickers, filings, news</div></div></Section>
<Section id="selection" name="Selection" note="Active controls use inset fill, not accent color." code={`<span className="rounded-[99px] bg-[#1a1b20] px-2.5 py-1">Equity</span>`}><div className="grid gap-5 sm:grid-cols-2"><div className="space-y-3"><Checkbox on={check} setOn={setCheck}/><div className="flex items-center gap-3"><span className="text-[14px] font-semibold">Alerts</span><Toggle on={on} setOn={setOn}/></div><Radio value={radio} setValue={setRadio}/></div><div><div className="mb-2 text-[12px] font-semibold uppercase tracking-kicker text-fey-low">Chips</div><Chips/><div className="mt-5"><Tabs/></div></div></div></Section>
<Section id="feedback" name="Feedback" note="Tone in title. Overlay shadows only." code={`box-shadow: 0 0 44px rgba(0,0,0,.8);`}><div className="grid gap-3 sm:grid-cols-2"><Alert tone="up" title="Beat"/><Alert tone="down" title="Miss"/><Alert tone="link" title="Filing"/><div className="flex items-center gap-5 rounded-[12px] bg-fey-2 p-4"><Spinner/><div className="flex-1"><Progress/></div></div><div className="sm:col-span-2"><Skeleton/></div></div></Section>
<Section id="data" name="Data display" note="Tabular numbers, P&L colors, hairlines inside tables." code={`<tr className="border-t border-white/10">...</tr>`}><div className="space-y-5"><div className="flex flex-wrap items-center gap-3"><Badge>AAPL</Badge><Badge>NVDA</Badge><Delta value={1.24}/><Delta value={-0.86}/><Spark/><Spark down/><span className="inline-flex h-8 w-8 items-center justify-center rounded-full bg-fey-2 text-[12px] font-semibold">TC</span><span className="inline-flex h-10 w-10 items-center justify-center rounded-full bg-fey-2 text-[12px] font-semibold">LM</span></div><Table/></div></Section>
<Section id="layout" name="Layout primitives" note="16px cards, 12px nested surfaces, no generic card shadow." code={`<div className="rounded-[16px] bg-[#0b0b0b] p-[18px]">...</div>`}><div className="grid gap-3 sm:grid-cols-2"><Card><div className="text-[14px] font-semibold text-fey-ink">Surface card</div><div className="mt-1 text-[13px] text-fey-mid">Tint only.</div></Card><div className="rounded-[12px] bg-fey-2 p-4"><div className="text-[14px] font-semibold text-fey-ink">Nested surface</div><div className="mt-1 text-[13px] text-fey-mid">Inside a card.</div></div></div><Divider/><div className="mt-5 flex items-center justify-between"><span className="text-[13px] text-fey-mid">Range</span><div className="inline-flex rounded-[99px] bg-fey-2 p-1"><button className="rounded-[99px] bg-fey-3 px-3 py-1 text-[12px] font-semibold text-fey-ink">1Y</button><button className="rounded-[99px] px-3 py-1 text-[12px] font-semibold text-fey-mid">5Y</button></div></div></Section>
<Section id="overlays" name="Overlays" note="Command palette and modal chrome use the overlay shadow." code={`<div className="rounded-[16px] bg-[#0b0b0b] shadow-[0_0_44px_rgba(0,0,0,.8)]">...</div>`}><div className="flex flex-wrap items-center gap-3"><Button>Open command palette</Button><Icon label="Close">×</Icon><Kbd>esc</Kbd></div></Section>
<p className="border-t border-white/10 py-8 text-[12px] text-fey-low">Restored full component/token gallery. Not affiliated with Fey or Wealthsimple.</p>
</main></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
