<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fey DS — Design System</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/feather-icons"></script>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>html,body{margin:0;background:#000;color:#e6e6e6;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif;-webkit-font-smoothing:antialiased}.tabular{font-variant-numeric:tabular-nums}.feather{width:15px;height:15px;stroke-width:1.8}pre{tab-size:2}</style>
</head>
<body><div id="root"></div>
<script type="text/babel" data-presets="react">
const {useEffect,useState}=React;
const c=(...x)=>x.filter(Boolean).join(' ');
function I({n}){return <i data-feather={n} className="feather"/>}
function Btn({children}){return <button className="rounded-full bg-[#e6e6e6] px-4 py-2 text-[13px] text-black">{children}</button>}
function IconBtn({n}){return <button className="inline-flex h-8 w-8 items-center justify-center rounded-full bg-[#131313] text-[#e6e6e6]"><I n={n}/></button>}
function Badge({children}){return <span className="rounded-full bg-[#131313] px-2.5 py-1 text-xs font-semibold text-white">{children}</span>}
function Delta({v}){return <span className={c('tabular text-[13px] font-semibold',v>=0?'text-[#4ebe96]':'text-[#ef5350]')}>{v>=0?'+':''}{v.toFixed(2)}%</span>}
function Card({children}){return <div className="rounded-2xl bg-[#0b0b0b] p-[18px]">{children}</div>}
function Copy({text}){const [done,setDone]=useState(false);return <button onClick={()=>{navigator.clipboard?.writeText(text);setDone(true);setTimeout(()=>setDone(false),900)}} className="rounded-full bg-[#1a1b20] px-2.5 py-1 text-[11px]">{done?'Copied':'Copy'}</button>}
function Section({id,title,note,code,children}){return <section id={id} className="scroll-mt-6 border-t border-white/10 py-9"><div className="mb-4"><h2 className="text-lg font-bold text-white">{title}</h2><p className="mt-1 text-[13px] text-[#868f97]">{note}</p></div><div className="rounded-2xl bg-[#0b0b0b] p-[18px]">{children}</div><div className="mt-3 rounded-2xl bg-[#070707] p-4"><div className="mb-2 flex justify-between text-[11px] uppercase tracking-[.16em] text-[#787878]"><span>JSX</span><Copy text={code}/></div><pre className="overflow-x-auto text-xs text-[#e6e6e6]"><code>{code}</code></pre></div></section>}
function Table(){return <div className="overflow-hidden rounded-2xl bg-black"><table className="w-full text-left"><thead className="text-xs uppercase tracking-[.16em] text-[#787878]"><tr><th className="p-4">Metric</th><th className="p-4">FY24</th><th className="p-4">YoY</th></tr></thead><tbody>{[['Revenue','394.3B','+2.9%'],['Gross profit','180.7B','+5.8%'],['Net income','93.7B','-3.4%']].map(r=><tr className="border-t border-white/10" key={r[0]}><td className="p-4 text-sm font-semibold text-white">{r[0]}</td><td className="p-4 tabular text-sm">{r[1]}</td><td className={c('p-4 tabular text-sm font-semibold',r[2][0]=='-'?'text-[#ef5350]':'text-[#4ebe96]')}>{r[2]}</td></tr>)}</tbody></table></div>}
function App(){const [query,setQuery]=useState('Apple Inc.'),[note,setNote]=useState('Watch earnings.'),[toggle,setToggle]=useState(true),[check,setCheck]=useState(true),[kind,setKind]=useState('Equity'),[currency,setCurrency]=useState('USD'),[tab,setTab]=useState('Overview');useEffect(()=>{if(window.feather)window.feather.replace()},[]);return <div className="min-h-screen bg-black"><div className="mx-auto grid max-w-[1180px] grid-cols-1 gap-8 px-5 py-8 lg:grid-cols-[220px_1fr]"><aside className="lg:sticky lg:top-8 lg:self-start"><a href="../" className="mb-6 block text-xs font-semibold text-[#479ffa]">← Markets app</a><div className="text-xs font-semibold uppercase tracking-[.16em] text-[#787878]">Fey-inspired</div><h1 className="mt-1 text-[26px] font-semibold text-white">Design system</h1><p className="mt-2 text-[13px] text-[#868f97]">React + Tailwind · SF Pro system stack</p><nav className="mt-6 space-y-1">{[['tokens','Tokens'],['type','Type'],['controls','Controls'],['forms','Forms'],['feedback','Feedback'],['data','Data'],['layout','Layout'],['overlays','Overlays']].map(x=><a key={x[0]} href={'#'+x[0]} className="block rounded-lg px-2.5 py-1.5 text-[13px] font-semibold text-[#868f97] hover:bg-[#0b0b0b] hover:text-white">{x[1]}</a>)}</nav></aside><main>
<Section id="tokens" title="Tokens" note="Pure-black canvas. Performance colors only." code={`const fey = { background:'#000', surface:'#0b0b0b', raised:'#131313', gain:'#4ebe96', loss:'#ef5350' };`}><div className="grid grid-cols-2 gap-2 sm:grid-cols-4">{[['#000','background'],['#0b0b0b','surface'],['#131313','raised'],['#1a1b20','inset'],['#fff','ink'],['#e6e6e6','high'],['#868f97','mid'],['#787878','low'],['#4ebe96','gain'],['#ef5350','loss'],['#479ffa','link'],['#ffa16c','highlight']].map(x=><div className="overflow-hidden rounded-xl bg-black" key={x[1]}><div className="h-14" style={{background:x[0]}}/><div className="p-2.5"><div className="text-xs font-semibold text-white">{x[1]}</div><div className="text-[11px] text-[#868f97]">{x[0]}</div></div></div>)}</div></Section>
<Section id="type" title="Type" note="54 / 26 / 18 / 14 / 12. System stack uses SF Pro on Apple." code={`font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui;`}><div className="space-y-3"><div className="text-[54px] font-semibold leading-none tracking-[-.08em] text-white">$229.87</div><div className="text-[26px] font-semibold text-white">Markets</div><div className="text-lg font-bold text-white">Apple raises services guidance</div><div className="text-sm font-semibold text-[#e6e6e6]">Body text</div><div className="text-xs font-semibold uppercase tracking-[.16em] text-[#787878]">Label</div></div></Section>
<Section id="controls" title="Buttons and controls" note="Light primary, icon actions, badges, deltas, keyboard hints." code={`<button className="rounded-full bg-[#e6e6e6] px-4 py-2 text-black">Export</button>`}><div className="flex flex-wrap items-center gap-3"><Btn>Get started</Btn><Btn>Export</Btn><IconBtn n="plus"/><IconBtn n="more-horizontal"/><Badge>AAPL</Badge><Delta v={1.24}/><Delta v={-0.86}/><kbd className="rounded-md bg-[#1a1b20] px-2 py-1 text-xs text-[#868f97]">cmd K</kbd></div></Section>
<Section id="forms" title="Forms" note="Raised #131313 surfaces, radius 12." code={`<input className="h-10 rounded-xl bg-[#131313] px-3.5" />`}><div className="grid gap-4 sm:grid-cols-2"><input value={query} onChange={e=>setQuery(e.target.value)} className="h-10 rounded-xl bg-[#131313] px-3.5 text-sm font-semibold text-white outline-none"/><textarea value={note} onChange={e=>setNote(e.target.value)} className="rounded-xl bg-[#131313] px-3.5 py-2.5 text-sm font-semibold text-white outline-none" rows="3"/><select value={currency} onChange={e=>setCurrency(e.target.value)} className="h-10 rounded-xl bg-[#131313] px-3.5 text-sm font-semibold text-white"><option>USD</option><option>EUR</option><option>SEK</option></select><div className="flex h-10 items-center gap-2 rounded-full bg-[#131313] px-3.5 text-sm text-[#787878]"><I n="search"/>Search tickers, filings, news</div></div></Section>
<Section id="feedback" title="Selection and feedback" note="Active uses inset fill. Tone belongs in the message title." code={`<div className="rounded-xl bg-[#131313] px-[18px] py-3">Beat</div>`}><div className="grid gap-3 sm:grid-cols-2"><button onClick={()=>setCheck(!check)} className="flex items-center gap-2.5 text-sm font-semibold"><span className={c('flex h-4 w-4 items-center justify-center rounded',check?'bg-[#e6e6e6] text-black':'bg-[#1a1b20]')}>{check?'✓':''}</span>Show after hours</button><button onClick={()=>setToggle(!toggle)} className={c('relative h-6 w-10 rounded-full',toggle?'bg-[#e6e6e6]':'bg-[#1a1b20]')}><span className={c('absolute top-0.5 h-5 w-5 rounded-full bg-black',toggle?'left-4':'left-0.5')}/></button><div className="space-y-2">{['Equity','ETF','Index'].map(x=><button key={x} onClick={()=>setKind(x)} className="mr-3 text-sm font-semibold"><span className={c('mr-2 inline-block h-4 w-4 rounded-full align-middle bg-[#1a1b20]',kind===x&&'ring-1 ring-[#e6e6e6]')}/>{x}</button>)}</div><div className="space-y-2"><div className="flex gap-2">{['Equity','ETF','Index'].map(x=><button key={x} className={c('rounded-full px-2.5 py-1 text-xs font-semibold',kind===x?'bg-[#1a1b20] text-white':'bg-[#131313] text-[#868f97]')}>{x}</button>)}</div><div className="space-y-2"><div className="flex items-center gap-2 text-sm font-semibold text-[#4ebe96]"><I n="trending-up"/>Beat</div><div className="flex items-center gap-2 text-sm font-semibold text-[#ef5350]"><I n="trending-down"/>Miss</div><div className="flex items-center gap-2 text-sm font-semibold text-[#479ffa]"><I n="file-text"/>Filing</div></div></div></div></Section>
<Section id="data" title="Data display" note="Tabular figures. Hairlines only inside tables." code={`<tr className="border-t border-white/10">...</tr>`}><div className="space-y-5"><div className="flex flex-wrap items-center gap-4"><I n="activity"/><span className="inline-flex h-8 w-8 items-center justify-center rounded-full bg-[#131313] text-xs font-semibold">TC</span><span className="inline-flex h-10 w-10 items-center justify-center rounded-full bg-[#131313] text-xs font-semibold">LM</span><svg width="72" height="28"><polyline fill="none" stroke="#4ebe96" strokeWidth="1.6" points="0,24 12,20 24,22 36,14 48,16 60,8 72,10"/></svg></div><Table/></div></Section>
<Section id="layout" title="Layout" note="Cards use tint, not generic shadows. Nested radius 12." code={`<div className="rounded-2xl bg-[#0b0b0b] p-[18px]">...</div>`}><div className="grid gap-3 sm:grid-cols-2"><Card><div className="font-semibold text-white">Surface card</div><div className="mt-1 text-sm text-[#868f97]">No outline. No generic shadow.</div></Card><div className="rounded-xl bg-[#131313] p-4"><div className="font-semibold text-white">Nested surface</div><div className="mt-1 text-sm text-[#868f97]">Inside a card.</div></div></div><div className="mt-5 border-t border-white/10 pt-5"><div className="flex gap-5 border-b border-white/10">{['Overview','Financials','Filings'].map(x=><button key={x} onClick={()=>setTab(x)} className={c('pb-2 text-sm font-semibold',tab===x?'text-white':'text-[#868f97]')}>{x}</button>)}</div></div></Section>
<Section id="overlays" title="Overlays" note="Modal and command surfaces use the overlay shadow." code={`box-shadow: 0 0 44px rgba(0,0,0,.8);`}><div className="flex flex-wrap items-center gap-3"><Btn>Open command palette</Btn><IconBtn n="x"/><kbd className="rounded-md bg-[#1a1b20] px-2 py-1 text-xs text-[#868f97]">esc</kbd><span className="inline-flex items-center gap-2 rounded-xl bg-[#131313] px-3.5 py-2 text-sm font-semibold text-white"><I n="check-circle"/>Saved</span></div></Section>
<p className="border-t border-white/10 py-8 text-xs text-[#787878]">Full restored component and token gallery. Not affiliated with Fey or Wealthsimple.</p>
</main></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>addEventListener('load',()=>{if(window.feather)window.feather.replace()})</script>
</body></html>
