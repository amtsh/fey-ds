<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Fey DS — Design System</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{
colors:{fey:{0:'#000',1:'#0b0b0b',2:'#131313',3:'#1a1b20',ink:'#fff',high:'#e6e6e6',mid:'#868f97',low:'#787878',up:'#4ebe96',down:'#ef5350',link:'#479ffa',hot:'#ffa16c'}},
fontFamily:{sans:['-apple-system','BlinkMacSystemFont','SF Pro Text','SF Pro Display','system-ui','Segoe UI','sans-serif']},
letterSpacing:{hero:'-0.08em',title:'-0.32px',kicker:'0.16em'},
boxShadow:{overlay:'0 0 44px rgba(0,0,0,0.8)',sticky:'0 0 35px rgba(0,0,0,0.5)'}
}}}
</script>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
html,body{background:#000;color:#e6e6e6;margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}.tabular{font-variant-numeric:tabular-nums}pre{tab-size:2}
</style>
</head>
<body><div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState}=React;
const cn=(...xs)=>xs.filter(Boolean).join(' ');
function PillButton({children,onClick}){return <button onClick={onClick} className="inline-flex items-center rounded-[99px] bg-fey-high px-4 py-[7px] text-[13px] font-normal text-black hover:bg-white active:scale-[0.98]">{children}</button>}
function GhostIconButton({label,children,onClick}){return <button aria-label={label} onClick={onClick} className="inline-flex h-8 w-8 items-center justify-center rounded-full bg-fey-2 text-fey-high hover:bg-fey-3">{children}</button>}
function Kbd({children}){return <kbd className="inline-flex h-[22px] min-w-[22px] items-center justify-center rounded-[6px] bg-fey-3 px-1.5 text-[11px] font-semibold text-fey-mid">{children}</kbd>}
function TickerBadge({children}){return <span className="inline-flex rounded-full bg-fey-2 px-2.5 py-1 text-[12px] font-semibold text-fey-ink">{children}</span>}
function Delta({value}){const up=value>=0;return <span className={cn('tabular text-[13px] font-semibold',up?'text-fey-up':'text-fey-down')}>{up?'+':''}{value.toFixed(2)}%</span>}
function SurfaceCard({children,className}){return <div className={cn('rounded-[16px] bg-fey-1 p-[18px]',className)}>{children}</div>}
function TextInput({value,onChange}){return <input value={value} onChange={e=>onChange(e.target.value)} placeholder="Search ticker" className="h-10 w-full rounded-[12px] bg-fey-2 px-3.5 text-[14px] font-semibold text-fey-ink outline-none placeholder:text-fey-low"/>}
function TextArea({value,onChange}){return <textarea value={value} onChange={e=>onChange(e.target.value)} rows={3} className="w-full resize-none rounded-[12px] bg-fey-2 px-3.5 py-2.5 text-[14px] font-semibold text-fey-ink outline-none"/>}
function Checkbox({checked,onChange}){return <button onClick={()=>onChange(!checked)} className="flex items-center gap-2.5 text-[14px] font-semibold"><span className={cn('flex h-4 w-4 items-center justify-center rounded-[4px]',checked?'bg-fey-high text-black':'bg-fey-3')}>{checked?'✓':''}</span>Show after hours</button>}
function Toggle({on,onChange}){return <button onClick={()=>onChange(!on)} className={cn('relative h-6 w-10 rounded-full',on?'bg-fey-high':'bg-fey-3')}><span className={cn('absolute top-0.5 h-5 w-5 rounded-full bg-black transition',on?'left-4':'left-0.5')}/></button>}
function Radio({value,onChange}){return <div className="space-y-2">{['Equity','ETF','Index'].map(o=><button key={o} onClick={()=>onChange(o)} className="flex items-center gap-2.5 text-[14px] font-semibold"><span className={cn('flex h-4 w-4 items-center justify-center rounded-full bg-fey-3',value===o&&'ring-1 ring-fey-high')}>{value===o&&<span className="h-2 w-2 rounded-full bg-fey-high"/>}</span>{o}</button>)}</div>}
function Select({value,onChange}){return <select value={value} onChange={e=>onChange(e.target.value)} className="h-10 rounded-[12px] bg-fey-2 px-3.5 text-[14px] font-semibold text-fey-ink outline-none"><option>USD</option><option>EUR</option><option>SEK</option></select>}
function Chip({children,on,onClick}){return <button onClick={onClick} className={cn('rounded-[99px] px-2.5 py-1 text-[12px] font-semibold',on?'bg-fey-3 text-fey-ink':'bg-fey-2 text-fey-mid')}>{children}</button>}
function Avatar({initials,size=32}){return <span className="inline-flex items-center justify-center rounded-full bg-fey-2 text-[12px] font-semibold text-fey-ink" style={{width:size,height:size}}>{initials}</span>}
function Spinner(){return <span className="inline-block h-4 w-4 animate-spin rounded-full border-2 border-fey-3 border-t-fey-high"/>}
function Progress({value}){return <div className="h-1.5 w-full overflow-hidden rounded-full bg-fey-3"><div className="h-full rounded-full bg-fey-high" style={{width:value+'%'}}/></div>}
function Skeleton(){return <div className="space-y-2"><div className="h-4 w-2/3 animate-pulse rounded bg-fey-2"/><div className="h-4 w-full animate-pulse rounded bg-fey-2"/><div className="h-4 w-5/6 animate-pulse rounded bg-fey-2"/></div>}
function Tabs({value,onChange}){return <div className="flex gap-5 border-b border-white/10">{['Overview','Financials','Filings'].map(t=><button key={t} onClick={()=>onChange(t)} className={cn('pb-2 text-[14px] font-semibold',value===t?'text-fey-ink':'text-fey-mid')}>{t}</button>)}</div>}
function Alert({tone,title,body}){const c=tone==='up'?'text-fey-up':tone==='down'?'text-fey-down':'text-fey-link';return <div className="rounded-[12px] bg-fey-2 px-[18px] py-3"><div className={cn('text-[13px] font-semibold',c)}>{title}</div><div className="mt-1 text-[13px] text-fey-mid">{body}</div></div>}
function Sparkline({up=true}){const p=up?'0,24 12,20 24,22 36,14 48,16 60,8 72,10':'0,8 12,10 24,8 36,15 48,17 60,23 72,25';return <svg width="72" height="28"><polyline fill="none" stroke={up?'#4ebe96':'#ef5350'} strokeWidth="1.6" points={p}/></svg>}
function DataTable(){const rows=[['Revenue','394.3B','+2.9%'],['Gross profit','180.7B','+5.8%'],['Net income','93.7B','-3.4%']];return <div className="overflow-hidden rounded-[16px] bg-fey-0"><table className="w-full text-left"><thead><tr className="text-[12px] font-semibold uppercase tracking-kicker text-fey-low"><th className="px-[18px] py-3">Metric</th><th className="px-[18px] py-3">FY24</th><th className="px-[18px] py-3">YoY</th></tr></thead><tbody>{rows.map(r=><tr key={r[0]} className="border-t border-white/10"><td className="px-[18px] py-3 text-[14px] font-semibold text-fey-ink">{r[0]}</td><td className="tabular px-[18px] py-3 text-[14px] font-semibold">{r[1]}</td><td className={cn('tabular px-[18px] py-3 text-[14px] font-semibold',r[2][0]==='-'?'text-fey-down':'text-fey-up')}>{r[2]}</td></tr>)}</tbody></table></div>}
function Copy({text}){const [ok,setOk]=useState(false);return <button onClick={async()=>{await navigator.clipboard.writeText(text);setOk(true);setTimeout(()=>setOk(false),1000)}} className="rounded-[99px] bg-fey-3 px-2.5 py-1 text-[11px] font-semibold text-fey-high">{ok?'Copied':'Copy'}</button>}
function Block({id,name,note,children,code='// See live component'}){return <section id={id} className="scroll-mt-5 border-t border-white/10 py-9"><div className="mb-4 flex items-end justify-between gap-4"><div><h2 className="text-[18px] font-bold tracking-title text-fey-ink">{name}</h2><p className="mt-1 text-[13px] text-fey-mid">{note}</p></div><a href={'#'+id} className="text-[12px] text-fey-low">#{id}</a></div><div className="rounded-[16px] bg-fey-1 p-[18px]">{children}</div><div className="mt-3 overflow-hidden rounded-[16px] bg-[#070707]"><div className="flex justify-between px-4 py-2"><span className="text-[11px] font-semibold uppercase tracking-kicker text-fey-low">JSX</span><Copy text={code}/></div><pre className="overflow-x-auto px-4 pb-4 text-[12px] text-fey-high"><code>{code}</code></pre></div></section>}
const tokens=[['#000000','background'],['#0b0b0b','surface'],['#131313','raised'],['#1a1b20','inset'],['#ffffff','ink'],['#e6e6e6','high / CTA'],['#868f97','mid'],['#787878','low'],['#4ebe96','gain'],['#ef5350','loss'],['#479ffa','link'],['#ffa16c','highlight']];
function App(){
const [text,setText]=useState('Apple Inc.');const [area,setArea]=useState('Watch earnings.');const [check,setCheck]=useState(true);const [toggle,setToggle]=useState(true);const [radio,setRadio]=useState('Equity');const [select,setSelect]=useState('USD');const [tab,setTab]=useState('Overview');const [chip,setChip]=useState('Equity');const [range,setRange]=useState('1Y');
const nav=[['tokens','Tokens'],['type','Type'],['button','Buttons'],['input','Inputs'],['selection','Selection'],['feedback','Feedback'],['data','Data'],['layout','Layout']];
return <div className="min-h-screen bg-fey-0"><div className="mx-auto grid max-w-[1180px] grid-cols-1 gap-8 px-5 py-8 lg:grid-cols-[210px_1fr]"><aside className="lg:sticky lg:top-8 lg:max-h-[calc(100vh-4rem)] lg:self-start lg:overflow-auto"><a href="../" className="mb-6 block text-[12px] font-semibold text-fey-link">← Markets app</a><div className="text-[12px] font-semibold uppercase tracking-kicker text-fey-low">Fey-inspired</div><h1 className="mt-1 text-[26px] font-semibold text-fey-ink">Design system</h1><p className="mt-2 text-[13px] text-fey-mid">System font, dark-first, React + Tailwind.</p><nav className="mt-6 space-y-1">{nav.map(([id,l])=><a key={id} href={'#'+id} className="block rounded-[10px] px-2.5 py-1.5 text-[13px] font-semibold text-fey-mid hover:bg-fey-1 hover:text-fey-ink">{l}</a>)}</nav></aside><main>
<Block id="tokens" name="Tokens" note="Pure-black canvas. Green/red only for performance."><div className="grid grid-cols-2 gap-2 sm:grid-cols-4">{tokens.map(([hex,label])=><div key={hex} className="overflow-hidden rounded-[12px] bg-fey-0"><div className="h-14" style={{background:hex}}/><div className="px-2.5 py-2"><div className="text-[12px] font-semibold text-fey-ink">{label}</div><div className="tabular text-[11px] text-fey-mid">{hex}</div></div></div>)}</div></Block>
<Block id="type" name="Type" note="System stack: SF Pro on Apple; system UI elsewhere." code={`font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui;`}><div className="space-y-3"><div className="text-[54px] font-semibold leading-[1.1] tracking-hero text-fey-ink">$229.87</div><div className="text-[26px] font-semibold text-fey-ink">Markets</div><div className="text-[18px] font-bold tracking-title text-fey-ink">Apple raises services guidance</div><div className="text-[14px] font-semibold text-fey-high">Body text stays 14 / 600.</div><div className="text-[12px] font-semibold uppercase tracking-kicker text-fey-low">Secondary label</div></div></Block>
<Block id="button" name="Buttons" note="Single light primary. Raised ghost actions." code={`<button className="rounded-[99px] bg-[#e6e6e6] px-4 py-[7px] text-[13px] text-black">Export</button>`}><div className="flex items-center gap-3"><PillButton>Get started</PillButton><PillButton>Export</PillButton><GhostIconButton label="Add">+</GhostIconButton><GhostIconButton label="More">···</GhostIconButton><Kbd>cmd</Kbd><Kbd>K</Kbd></div></Block>
<Block id="input" name="Inputs" note="Raised #131313 surfaces. Radius 12." code={`<input className="h-10 rounded-[12px] bg-[#131313] px-3.5 text-[14px] font-semibold"/>`}><div className="grid gap-4 sm:grid-cols-2"><TextInput value={text} onChange={setText}/><TextArea value={area} onChange={setArea}/><Select value={select} onChange={setSelect}/><div><div className="mb-2 text-[12px] font-semibold uppercase tracking-kicker text-fey-low">Search</div><div className="flex h-10 items-center rounded-[99px] bg-fey-2 px-3.5 text-[14px] font-semibold text-fey-low">Search tickers, filings, news</div></div></div></Block>
<Block id="selection" name="Selection" note="No accent-blue selection. Active uses inset surface." code={`<button className="rounded-[99px] bg-[#1a1b20] px-2.5 py-1">Equity</button>`}><div className="grid gap-5 sm:grid-cols-2"><div className="space-y-3"><Checkbox checked={check} onChange={setCheck}/><div className="flex items-center gap-3"><span className="text-[14px] font-semibold">Price alerts</span><Toggle on={toggle} onChange={setToggle}/></div><Radio value={radio} onChange={setRadio}/></div><div><div className="mb-2 text-[12px] font-semibold uppercase tracking-kicker text-fey-low">Filters</div><div className="flex flex-wrap gap-2">{['Equity','ETF','Index'].map(c=><Chip key={c} on={chip===c} onClick={()=>setChip(c)}>{c}</Chip>)}</div><div className="mt-5"><Tabs value={tab} onChange={setTab}/></div></div></div></Block>
<Block id="feedback" name="Feedback" note="Shadows only on overlays; cards use tint, not shadow." code={`overlay: 0 0 44px rgba(0,0,0,.8);`}><div className="grid gap-3 sm:grid-cols-2"><Alert tone="up" title="Beat" body="EPS above consensus."/><Alert tone="down" title="Miss" body="Revenue below estimate."/><Alert tone="link" title="Filing" body="10-Q posted."/><div className="flex items-center gap-5 rounded-[12px] bg-fey-2 p-4"><Spinner/><div className="flex-1"><Progress value={64}/></div></div><div className="sm:col-span-2"><Skeleton/></div></div></Block>
<Block id="data" name="Data display" note="Tabular numbers. Hairlines only in rows/tables." code={`<tr className="border-t border-white/10">...</tr>`}><div className="space-y-5"><div className="flex flex-wrap items-center gap-3"><TickerBadge>AAPL</TickerBadge><TickerBadge>NVDA</TickerBadge><Delta value={1.24}/><Delta value={-0.86}/><Sparkline up/><Sparkline up={false}/><Avatar initials="TC"/><Avatar initials="LM" size={40}/></div><DataTable/></div></Block>
<Block id="layout" name="Layout primitives" note="16px cards, 12px nested surfaces, 1px 10% white hairlines." code={`<div className="rounded-[16px] bg-[#0b0b0b] p-[18px]">...</div>`}><div className="grid gap-3 sm:grid-cols-2"><SurfaceCard><div className="text-[14px] font-semibold text-fey-ink">Surface card</div><div className="mt-1 text-[13px] text-fey-mid">No outline. No generic shadow.</div></SurfaceCard><div className="rounded-[12px] bg-fey-2 p-4"><div className="text-[14px] font-semibold text-fey-ink">Nested surface</div><div className="mt-1 text-[13px] text-fey-mid">Use inside a card.</div></div></div><div className="mt-5 flex items-center justify-between"><div className="text-[13px] text-fey-mid">Range</div><div className="inline-flex rounded-[99px] bg-fey-2 p-1">{['1D','1W','1M','1Y'].map(r=><button key={r} onClick={()=>setRange(r)} className={cn('rounded-[99px] px-3 py-1 text-[12px] font-semibold',range===r?'bg-fey-3 text-fey-ink':'text-fey-mid')}>{r}</button>)}</div></div></Block>
<p className="border-t border-white/10 py-8 text-[12px] text-fey-low">Not affiliated with Fey or Wealthsimple.</p>
</main></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
